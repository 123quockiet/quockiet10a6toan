    flash.setDepth(12);
    this.tweens.add({
      targets: flash,
      radius: 35,
      alpha: 0,
      duration: 220,
      onComplete: () => flash.destroy()
    });

    // 2. Exploding anvil sparks
    for (let i = 0; i < 7; i++) {
      const angle = -Math.PI * 0.15 - (i / 7) * Math.PI * 0.7;
      const dist = Phaser.Math.Between(20, 50);
      const sp = this.add.circle(x, y, Phaser.Math.Between(1.5, 3), tintColor, 1).setDepth(13);
      this.tweens.add({
        targets: sp,
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        alpha: 0,
        scale: 0.1,
        duration: 240,
        onComplete: () => sp.destroy()
      });
    }
  }

  createMonsters() {
    this.monsters = [];
    const chapterMonsters = GAME_DATA.monsters.filter(m => (m.chapter || 1) === this.currentChapter);

    chapterMonsters.forEach((mData, idx) => {
      if (window.defeatedMonsters.includes(mData.id)) return;

      let textureKey = 'mon_' + mData.id;
      let frameKey = undefined;
      if (!this.textures.exists(textureKey)) {
        if (this.textures.exists('entities') && this.textures.get('entities').has(textureKey)) {
          frameKey = textureKey;
          textureKey = 'entities';
        } else if (mData.id === 'malakar_p1') {
          textureKey = this.textures.exists('mon_malakar_p1') ? 'mon_malakar_p1' : (this.textures.exists('mon_boss_malakar') ? 'mon_boss_malakar' : 'entities');
          if (textureKey === 'entities') frameKey = 'mon_boss_malakar';
        } else if (mData.id === 'malakar_p2') {
          textureKey = this.textures.exists('mon_malakar_p2') ? 'mon_malakar_p2' : (this.textures.exists('mon_boss_malakar_p2') ? 'mon_boss_malakar_p2' : 'entities');
          if (textureKey === 'entities') frameKey = 'mon_boss_malakar_p2';
        } else if (mData.id === 'orc_armor') {
          textureKey = this.textures.exists('mon_orc_armor') ? 'mon_orc_armor' : (this.textures.exists('mon_orc_axe') ? 'mon_orc_axe' : 'entities');
          if (textureKey === 'entities') frameKey = 'mon_orc_axe';
        } else if (mData.id === 'orc_shaman') {
          textureKey = this.textures.exists('mon_orc_shaman') ? 'mon_orc_shaman' : (this.textures.exists('mon_orc_enrage') ? 'mon_orc_enrage' : 'entities');
          if (textureKey === 'entities') frameKey = 'mon_orc_enrage';
        } else if (mData.type === 'boss') {
          textureKey = this.textures.exists('mon_boss_malakar') ? 'mon_boss_malakar' : 'entities';
          if (textureKey === 'entities') frameKey = 'mon_boss_malakar';
        } else if (mData.type === 'medium') {
          textureKey = this.textures.exists('mon_orc_axe') ? 'mon_orc_axe' : 'entities';
          if (textureKey === 'entities') frameKey = 'mon_orc_axe';
        } else {
          textureKey = 'mon_slime';
        }
      }

      // Proportional scaling for each monster tier
      let mScale = 0.58;
      if (mData.id === 'shadow_phoenix') mScale = 0.95;
      else if (mData.id === 'ancient_golem') mScale = 0.72;
      else if (mData.id === 'infernal_demon') mScale = 0.65;
      else if (mData.id === 'acid_basilisk') mScale = 0.68;
      else if (mData.id === 'frost_wraith') mScale = 0.65;
      else if (mData.id === 'magma_crusher') mScale = 0.88;
      else if (mData.id === 'cyclops_berserker') mScale = 0.72;
      else if (mData.id === 'thorny_behemoth') mScale = 0.60;
      else if (mData.id === 'plague_wyrm') mScale = 0.60;
      else if (mData.id === 'shadow_stalker') mScale = 0.58;
      else if (mData.id === 'skeleton_warrior') mScale = 0.56;
      else if (mData.id === 'toxic_slime') mScale = 0.52;
      else if (mData.id === 'void_ghast') mScale = 0.56;
      else if (mData.id === 'frost_fang') mScale = 0.56;
      else if (mData.id === 'storm_harpy') mScale = 0.62;
      else if (mData.type === 'boss') mScale = 0.85;
      else if (mData.type === 'medium') mScale = 0.55;

      const isFlying = (mData.id === 'bat' || mData.id === 'bat_vampire' || mData.id === 'shadow_phoenix' || mData.id === 'frost_wraith' || mData.id === 'void_ghast' || mData.id === 'storm_harpy');
      const startSpawnY = isFlying ? (this.groundY - 85) : (this.groundY - 10);

      // 1. Monster Ground Contact Shadow
      const shadowW = (mData.type === 'boss') ? 110 : (mData.type === 'medium' ? 62 : 46);
      const mShadow = this.add.ellipse(mData.x, this.groundY - 2, shadowW, 14, 0x000000, 0.45).setDepth(4);

      // 2. Boss Demonic Ground Aura
      let bossAura = null;
      if (mData.type === 'boss') {
        let auraColor = 0xa855f7;
        if (mData.id === 'shadow_phoenix') auraColor = 0x9333ea;
        else if (mData.id === 'magma_crusher') auraColor = 0xff2200;
        else if (mData.id === 'cyclops_berserker') auraColor = 0xff6600;
        else if (mData.id === 'panther') auraColor = 0xff0055;
        bossAura = this.add.ellipse(mData.x, this.groundY - 2, 130, 26);
        bossAura.setStrokeStyle(3, auraColor, 0.85).setDepth(3);
        this.tweens.add({
          targets: bossAura,
          scaleX: 1.3,
          scaleY: 1.3,
          alpha: 0.25,
          duration: 900,
          yoyo: true,
          repeat: -1
        });
      }

      const mon = this.physics.add.sprite(mData.x, startSpawnY, textureKey, frameKey);
      mon.setOrigin(0.5, 1);
      mon.setScale(mScale);
      mon.setDepth(10);
      mon.setCollideWorldBounds(true);

      if (isFlying) {
        mon.body.setAllowGravity(false);
        mon.body.immovable = true;
        // Sinusoidal Wing Flapping Flight Tween
        this.tweens.add({
          targets: mon,
          y: this.groundY - 120,
          duration: 550,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });
        // Wing shadow pulsing
        this.tweens.add({
          targets: mShadow,
          scaleX: 0.75,
          scaleY: 0.75,
          alpha: 0.28,
          duration: 550,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });
      } else {
        this.physics.add.collider(mon, this.platforms);
      }

      // Facing orientation towards approaching player (facing left towards Kael)
      const flipList = [
        'acid_basilisk', 'infernal_demon', 'ancient_golem', 'shadow_phoenix', 'panther',
        'mushroom', 'mushroom_crystal', 'skeleton_warrior', 'toxic_slime', 'shadow_stalker',
        'plague_wyrm', 'thorny_behemoth', 'cyclops_berserker', 'magma_crusher',
        'void_ghast', 'frost_fang', 'storm_harpy'
      ];
      if (flipList.includes(mData.id)) {
        mon.setFlipX(true);
      }

      const isBoss = mData.type === 'boss';
      const monH = mon.displayHeight || (isBoss ? 160 : 90);
      const tagColor = isBoss ? '#ff1744' : (mData.type === 'medium' ? '#ffaa00' : '#44ff88');
      const prefix = mData.questionIndex + 1;

      let nameTag;
      if (isBoss) {
        let bossTitle = `👑 TRÙM: ${mData.name.toUpperCase()} 👑`;
        if (mData.id === 'shadow_phoenix') bossTitle = `👑 BOSS 8: ${mData.name.toUpperCase()} 👑`;
        else if (mData.id === 'cyclops_berserker') bossTitle = `👑 TRÙM TIÊN PHONG: ${mData.name.toUpperCase()} 👑`;
        else if (mData.id === 'magma_crusher') bossTitle = `👑 ĐẠI TRÙM CUỐI: ${mData.name.toUpperCase()} 👑`;

        nameTag = this.add.text(mData.x, this.groundY - monH - 35, bossTitle, {
          fontFamily: FONT_PRIMARY,
          fontWeight: '900',
          fontSize: '12px',
          color: '#ffd700',
          backgroundColor: '#1b0626',
          stroke: mData.id === 'magma_crusher' ? '#ff3300' : '#a855f7',
          strokeThickness: 3,
          padding: { x: 8, y: 5 }
        }).setOrigin(0.5).setDepth(25);
        this.tweens.add({
          targets: nameTag,
          scale: 1.08,
          duration: 700,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });
      } else {
        nameTag = this.add.text(mData.x, this.groundY - monH - 25, `${prefix}. ${mData.name}`, {
          fontFamily: FONT_PRIMARY,
          fontWeight: '700',
          fontSize: '10px',
          color: tagColor,
          backgroundColor: '#0a0a16',
          padding: { x: 5, y: 3 }
        }).setOrigin(0.5).setDepth(15);
      }

      const questIconText = isBoss ? '⚔️ KHIÊU CHIẾN BOSS [CLICK / TIẾP CẬN] ⚔️' : '⚔️';
      const questIcon = this.add.text(mData.x, this.groundY - monH - (isBoss ? 65 : 48), questIconText, {
        fontSize: isBoss ? '11px' : '15px',
        fontWeight: isBoss ? '800' : '400',
        fontFamily: FONT_PRIMARY,
        color: isBoss ? '#ff3366' : '#ffffff',
        backgroundColor: isBoss ? '#0f051d' : 'transparent',
        padding: isBoss ? { x: 6, y: 3 } : 0
      }).setOrigin(0.5).setDepth(26);

      this.tweens.add({
        targets: questIcon,
        y: this.groundY - monH - (isBoss ? 75 : 58),
        duration: 700,
        yoyo: true,
        repeat: -1
      });

      mon.dataRef = mData;
      mon.nameTag = nameTag;
      mon.questIcon = questIcon;
      mon.contactShadow = mShadow;
      mon.bossAura = bossAura;

      mon.setInteractive({ useHandCursor: true });
      mon.on('pointerdown', () => {
        if (!this.isInCombat) this.startCombat(mon);
      });
      nameTag.setInteractive({ useHandCursor: true });
      nameTag.on('pointerdown', () => {
        if (!this.isInCombat) this.startCombat(mon);
      });
      questIcon.setInteractive({ useHandCursor: true });
      questIcon.on('pointerdown', () => {
        if (!this.isInCombat) this.startCombat(mon);
      });

      this.tweens.add({
        targets: mon,
        x: mData.x + 35,
        duration: 2200,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });

      this.monsters.push(mon);
    });
  }

  handleDefeatedMonster(monsterId) {
    this.isInCombat = false;

    if (!window.defeatedMonsters.includes(monsterId)) {
      window.defeatedMonsters.push(monsterId);
    }

    const monIdx = this.monsters.findIndex(m => m.dataRef.id === monsterId);
    if (monIdx !== -1) {
      const mon = this.monsters[monIdx];
      if (mon.nameTag) mon.nameTag.destroy();
      if (mon.questIcon) mon.questIcon.destroy();
      if (mon.contactShadow) mon.contactShadow.destroy();
      if (mon.bossAura) mon.bossAura.destroy();
      mon.destroy();
      this.monsters.splice(monIdx, 1);
    }

    // Boss 8 (Shadow Phoenix / Panther) Defeated -> Transition to Chapter 2 (New Map)
    if (monsterId === 'shadow_phoenix' || monsterId === 'panther') {
      this.showChapterBanner("⚔️ Tiêu diệt Chúa tể rừng sâu (Boss Hắc Ám Phượng Hoàng)! Đang tiến vào Hầm Ngục (Chương 2)... ⚔️");
      audioSynth.playLevelUp();
      this.time.delayedCall(1600, () => {
        this.cameras.main.fade(800, 0, 0, 0);
        this.time.delayedCall(850, () => {
          this.switchChapter(2);
        });
      });
      return;
    }

    this.showChapterBanner(`Tiêu diệt quái vật thành công!`);
  }

  switchChapter(chapterNum) {
    this.currentChapter = chapterNum;
    window.currentChapter = chapterNum;
    this.worldWidth = this.currentChapter === 1 ? 4200 : 4500;
    this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);

    // Destroy old entities and parallax effects
    if (this.bgSky) this.bgSky.destroy();
    if (this.bgDungeon) this.bgDungeon.destroy();
    if (this.platforms) this.platforms.clear(true, true);
    if (this.decorations) this.decorations.forEach(d => d.destroy && d.destroy());
    this.decorations = [];
    if (this.particles) this.particles.forEach(p => p.destroy && p.destroy());
    this.particles = [];
    if (this.fallingLeaves) this.fallingLeaves.forEach(l => l.destroy && l.destroy());
    this.fallingLeaves = [];
    if (this.fireflies) this.fireflies.forEach(f => f.destroy && f.destroy());
    this.fireflies = [];
    if (this.godRays) this.godRays.forEach(r => r.destroy && r.destroy());
    this.godRays = [];

    if (this.monsters) {
      this.monsters.forEach(m => {
        if (m.nameTag) m.nameTag.destroy();
        if (m.questIcon) m.questIcon.destroy();
        if (m.contactShadow) m.contactShadow.destroy();
        if (m.bossAura) m.bossAura.destroy();
        m.destroy();
      });
      this.monsters = [];
    }
    if (this.wizardObj) this.wizardObj.destroy();
    if (this.arthurObj) this.arthurObj.destroy();
    if (this.chapterGate) {
      this.chapterGate.destroy();
      this.chapterGate = null;
    }
    this.chests = [];

    // Rebuild terrain & parallax for Chapter 2
    this.createParallax();
    this.createTerrain();

    // Re-establish player in Chapter 2 with physics collision & high depth
    if (this.player && this.player.active) {
      this.player.setPosition(160, this.groundY - 70);
      this.player.setVelocity(0, 0);
      this.player.setDepth(15);
      this.physics.add.collider(this.player, this.platforms);
      if (this.anims.exists('anim_player_idle')) {
        this.player.play('anim_player_idle');
      }
    } else {
      this.createPlayer();
    }

    if (this.playerShadow) {
      this.playerShadow.x = 160;
      this.playerShadow.y = this.groundY - 2;
      this.playerShadow.setDepth(4);
    }

    this.bindChestOverlaps();
    this.bindGateOverlap();
    this.createNPCs();
    this.createMonsters();

    // Camera follow and bounds
    this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1, -100, 0);
    this.cameras.main.fadeIn(800, 0, 0, 0);

    const bannerText = chapterNum === 2 ? "⚔️ Hầm Ngục Ma Giáp – Chương 2 ⚔️" : "⚔️ Rừng Hoang Dã – Chương 1 ⚔️";
    this.showChapterBanner(bannerText);

    if (this.chapterBadge) {
      this.chapterBadge.setText(chapterNum === 2 ? "Chương 2: Hầm ngục" : "Chương 1: Rừng hoang dã");
      this.chapterBadge.setColor(chapterNum === 2 ? "#ff3366" : "#00ff88");
    }
  }

  update() {
    if (this.isDialogueOpen || this.isShopOpen || this.isInventoryOpen) {
      this.player.setVelocityX(0);
      return;
    }

    // Mobile & PC Quick Triggers
    const isDashTriggered = Phaser.Input.Keyboard.JustDown(this.keyShift) || (window.touchControls && window.touchControls.dashJustPressed);
    if (window.touchControls) window.touchControls.dashJustPressed = false;
    if (isDashTriggered) {
      this.performPlayerDash();
    }

    const isAttackTriggered = Phaser.Input.Keyboard.JustDown(this.keyJ) || (window.touchControls && window.touchControls.attackJustPressed);
    if (window.touchControls) window.touchControls.attackJustPressed = false;
    if (isAttackTriggered) {
      this.performPlayerAttack();
    }

    const isHealTriggered = Phaser.Input.Keyboard.JustDown(this.keyH) || (window.touchControls && window.touchControls.healJustPressed);
    if (window.touchControls) window.touchControls.healJustPressed = false;
    if (isHealTriggered) {
      this.drinkPotion('hp');
    }

    const isInvTriggered = (window.touchControls && window.touchControls.invJustPressed);
    if (window.touchControls) window.touchControls.invJustPressed = false;
    if (isInvTriggered) {
      this.toggleInventoryModal();
    }

    if (Phaser.Input.Keyboard.JustDown(this.keyB)) {
      const mon = this.monsters.find(m => m.active) || this.monsters[0];
      if (mon && !this.isInCombat) this.startCombat(mon);
    }

    if (Phaser.Input.Keyboard.JustDown(this.keyP)) {
      if (typeof window.teleportToBoss === 'function') window.teleportToBoss();
    }

    if (this.isDashing) {
      return;
    }

    const speed = GAME_DATA.player.speed;
    const isMovingLeft = this.cursors.left.isDown || this.keyA.isDown || (window.touchControls && window.touchControls.left);
    const isMovingRight = this.cursors.right.isDown || this.keyD.isDown || (window.touchControls && window.touchControls.right);
    const isJumping = this.cursors.up.isDown || this.keyW.isDown || this.keySpace.isDown || (window.touchControls && window.touchControls.jump);

    if (isMovingLeft) {
      this.player.setVelocityX(-speed);
      this.player.setFlipX(true);
      if (!this.isAttacking && this.player.body.touching.down && this.anims.exists('anim_player_run') && this.player.anims.currentAnim?.key !== 'anim_player_run') {
        this.player.play('anim_player_run');
      }
    } else if (isMovingRight) {
      this.player.setVelocityX(speed);
      this.player.setFlipX(false);
      if (!this.isAttacking && this.player.body.touching.down && this.anims.exists('anim_player_run') && this.player.anims.currentAnim?.key !== 'anim_player_run') {
        this.player.play('anim_player_run');
      }
    } else {
      this.player.setVelocityX(0);
      if (!this.isAttacking && this.player.body.touching.down && this.anims.exists('anim_player_idle') && this.player.anims.currentAnim?.key !== 'anim_player_idle') {
        this.player.play('anim_player_idle');
      }
    }

    // Footstep dust puffs when running
    if ((isMovingLeft || isMovingRight) && this.player.body.touching.down) {
      this.footstepTimer = (this.footstepTimer || 0) + 1;
      if (this.footstepTimer >= 9) {
        this.footstepTimer = 0;
        this.spawnFootstepDust(this.player.x + (this.player.flipX ? 16 : -16), this.player.y + 40);
      }
    } else {
      this.footstepTimer = 8;
    }

    // Jump dust burst
    if (isJumping && this.player.body.touching.down) {
      this.player.setVelocityY(-450);
      audioSynth.playJump();
      this.spawnJumpDust(this.player.x, this.player.y + 42);
    }

    // Landing shockwave detection
    const isGrounded = this.player.body.touching.down;
    if (!this.wasInAir && !isGrounded) {
      this.wasInAir = true;
    } else if (this.wasInAir && isGrounded) {
      this.wasInAir = false;
      this.spawnLandingDust(this.player.x, this.player.y + 42);
    }

    // Dynamic Parallax Scrolling: Map moves smoothly along with the hero!
    if (this.bgSky) {
      this.bgSky.tilePositionX = this.cameras.main.scrollX * 0.22;
    }
    if (this.bgDungeon) {
      this.bgDungeon.tilePositionX = this.cameras.main.scrollX * 0.28;
    }

    // 1. Dynamic Falling Forest Leaves Update (Chapter 1)
    if (this.fallingLeaves && this.fallingLeaves.length > 0) {
      this.fallingLeaves.forEach(leaf => {
        leaf.timer += leaf.swaySpeed;
        leaf.y += leaf.fallSpeed;
        leaf.x = leaf.baseX + Math.sin(leaf.timer) * leaf.swayAmp;
        leaf.rotation += leaf.rotSpeed;
        if (leaf.y > this.groundY + 40) {
          leaf.y = -20;
          leaf.baseX = Phaser.Math.Between(0, this.worldWidth);
        }
      });
    }

    // 2. Rising Torch Smoke Wisps
    this.smokeTimer = (this.smokeTimer || 0) + 1;
    if (this.smokeTimer >= 20 && this.torchPositions && this.torchPositions.length > 0) {
      this.smokeTimer = 0;
      const cam = this.cameras.main;
      this.torchPositions.forEach(tp => {
        if (tp.x >= cam.scrollX - 60 && tp.x <= cam.scrollX + cam.width + 60) {
          const sm = this.add.image(tp.x + Phaser.Math.Between(-3, 3), tp.y - 8, 'vfx_smoke');
          sm.setScale(0.35);
          sm.setAlpha(0.45);
          sm.setDepth(8);
          this.tweens.add({
            targets: sm,
            y: tp.y - Phaser.Math.Between(35, 55),
            x: sm.x + Phaser.Math.Between(-14, 14),
            scale: 0.9,
            alpha: 0,
            duration: 950,
            ease: 'Sine.easeOut',
            onComplete: () => sm.destroy()
          });
        }
      });
    }

    // 3. Ambient Atmospheric Sky Lightning in Chapter 2
    if (this.currentChapter === 2) {
      this.lightningTimer = (this.lightningTimer || 0) + 1;
      if (this.lightningTimer >= 650) {
        this.lightningTimer = Phaser.Math.Between(0, 180);
        this.cameras.main.flash(90, 160, 90, 220, false);
      }
    }

    // 4. Hero Weapon Blade Sheen & Low-HP Danger Pulse
    this.heroAuraTimer = (this.heroAuraTimer || 0) + 1;
    if (this.heroAuraTimer >= 14 && this.player && this.player.active) {
      this.heroAuraTimer = 0;
      if (GAME_DATA.player.hp <= 35) {
        const dangerRing = this.add.ellipse(this.player.x, this.player.y + 6, 42, 58);
        dangerRing.setStrokeStyle(2, 0xff0044, 0.85);
        dangerRing.setDepth(12);
        this.tweens.add({
          targets: dangerRing,
          scaleX: 1.45,
          scaleY: 1.45,
          alpha: 0,
          duration: 380,
          onComplete: () => dangerRing.destroy()
        });
      } else {
        const swordOffsetX = this.player.flipX ? -22 : 22;
        const spark = this.add.image(this.player.x + swordOffsetX, this.player.y - 6, 'vfx_sparkle');
        spark.setScale(0.4);
        spark.setTint(0x00e5ff);
        spark.setDepth(14);
        this.tweens.add({
          targets: spark,
          y: spark.y - 18,
          alpha: 0,
          scale: 0.1,
          duration: 380,
          onComplete: () => spark.destroy()
        });
      }
    }

    // --- Dynamic NPC Proximity & Interaction System ---
    if (this.wizardObj && this.wizardObj.active) {
      const distW = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.wizardObj.x, this.wizardObj.y);
      const isNearW = distW < 135;
      if (this.wizardObj.bubble) {
        this.wizardObj.bubble.setAlpha(isNearW ? 1 : 0);
      }
      if (isNearW && this.wizardObj.currentMode !== 'greet' && !this.isDialogueOpen) {
        this.wizardObj.currentMode = 'greet';
        if (this.anims.exists('anim_wizard_greet')) this.wizardObj.play('anim_wizard_greet');
      } else if (!isNearW && this.wizardObj.currentMode !== 'idle' && !this.isDialogueOpen) {
        this.wizardObj.currentMode = 'idle';
        if (this.anims.exists('anim_wizard_idle')) this.wizardObj.play('anim_wizard_idle');
      }
    }

    if (this.arthurObj && this.arthurObj.active) {
      const distA = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.arthurObj.x, this.arthurObj.y);
      const isNearA = distA < 135;
      if (this.arthurObj.bubble) {
        this.arthurObj.bubble.setAlpha(isNearA ? 1 : 0);
      }
      if (isNearA && this.arthurObj.currentMode !== 'shop' && !this.isShopOpen) {
        this.arthurObj.currentMode = 'shop';
        if (this.anims.exists('anim_blacksmith_shop')) this.arthurObj.play('anim_blacksmith_shop');
      } else if (!isNearA && this.arthurObj.currentMode !== 'forge' && !this.isShopOpen) {
        this.arthurObj.currentMode = 'forge';
        if (this.anims.exists('anim_blacksmith_forge')) this.arthurObj.play('anim_blacksmith_forge');
      }
    }

    // --- Dynamic Fireflies Drift (Chapter 1) ---
    if (this.fireflies && this.fireflies.length > 0) {
      this.fireflies.forEach(ff => {
        ff.time += 0.025;
        ff.y = ff.baseY + Math.sin(ff.time) * 14;
        ff.x += Math.cos(ff.time * 0.7) * 0.35;
      });
    }

    const isInteract = Phaser.Input.Keyboard.JustDown(this.keyE) || (window.touchControls && window.touchControls.interactJustPressed);
    if (window.touchControls) window.touchControls.interactJustPressed = false;

    if (this.isDialogueOpen && (isInteract || isAttackTriggered)) {
      if (typeof this.advanceDialogue === 'function') {
        this.advanceDialogue();
      }
      return;
    }

    if (isInteract) {
      const distToWizard = (this.wizardObj && this.wizardObj.active) ? Phaser.Math.Distance.Between(this.player.x, this.player.y, this.wizardObj.x, this.wizardObj.y) : 9999;
      const distToArthur = (this.arthurObj && this.arthurObj.active) ? Phaser.Math.Distance.Between(this.player.x, this.player.y, this.arthurObj.x, this.arthurObj.y) : 9999;

      if (distToWizard < 135 && distToWizard <= distToArthur) {
        const diag = this.currentChapter === 2 ? [
          { speaker: "Linh Hồn Eldrin", text: "Dũng sĩ Kael! Ngươi đã đột nhập vào Hầm Ngục Ma Giáp!" },
          { speaker: "Linh Hồn Eldrin", text: "Binh đoàn Hầm Ngục và Đại Trùm Khổng Lồ Dung Nham đang canh giữ Hạt Giống Tro Tàn." },
          { speaker: "Linh Hồn Eldrin", text: "Hãy vận dụng tri thức Đại Số Vectơ để đập tan ma lực của chúng!" }
        ] : GAME_DATA.dialogues.wizardIntro;
        this.openDialogue(diag);
      } else if (distToArthur < 135) {
        this.openShop();
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keyI) || Phaser.Input.Keyboard.JustDown(this.keyC)) {
      this.toggleInventoryModal();
    }

    if (Phaser.Input.Keyboard.JustDown(this.key2) || Phaser.Input.Keyboard.JustDown(this.keyH) || (window.touchControls && window.touchControls.healJustPressed)) {
      if (window.touchControls) window.touchControls.healJustPressed = false;
      this.drinkPotion('hp');
    }
    if (Phaser.Input.Keyboard.JustDown(this.key3)) {
      this.drinkPotion('mp');
    }
    if (Phaser.Input.Keyboard.JustDown(this.key1)) {
      this.performPlayerAttack();
    }

    this.monsters.forEach(m => {
      if (!m.active) return;
      const isBoss = m.dataRef && m.dataRef.type === 'boss';
      const triggerDist = isBoss ? 165 : 110;
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, m.x, m.y);
      if (dist < triggerDist && !this.isInCombat) {
        this.startCombat(m);
      }
    });

    // Dynamic Player Ground Shadow
    if (this.playerShadow && this.player && this.player.active) {
      this.playerShadow.x = this.player.x;
      const feetY = this.player.y + 45;
      let groundLevel = this.groundY - 2;
      if (this.platforms && this.platforms.getChildren) {
        const platChildren = this.platforms.getChildren();
        for (let i = 0; i < platChildren.length; i++) {
          const p = platChildren[i];
          const hw = (p.displayWidth || p.width) / 2;
          const topY = p.y - ((p.displayHeight || p.height) / 2);
          if (this.player.x >= p.x - hw && this.player.x <= p.x + hw) {
            if (topY >= feetY - 8 && topY < groundLevel) {
              groundLevel = topY;
            }
          }
        }
      }
      this.playerShadow.y = groundLevel;
      const heightAbove = Math.max(0, groundLevel - feetY);
      const sFactor = Math.max(0.35, 1 - (heightAbove / 220));
      this.playerShadow.scaleX = sFactor;
      this.playerShadow.scaleY = sFactor;
      this.playerShadow.alpha = 0.45 * sFactor;
    }

    this.monsters.forEach(m => {
      if (m.nameTag) {
        m.nameTag.x = m.x;
      }
      if (m.questIcon) {
        m.questIcon.x = m.x;
      }
      if (m.contactShadow) {
        m.contactShadow.x = m.x;
      }
      if (m.bossAura) {
        m.bossAura.x = m.x;
      }
    });

    if (this.heroLight && this.player) {
      this.heroLight.x = this.player.x;
      this.heroLight.y = this.player.y - 10;
    }

    this.updateHUD();
  }

  performPlayerDash() {
    if (this.isDashing) return;
    this.isDashing = true;
    const dashDir = this.player.flipX ? -1 : 1;
    this.player.setVelocityX(dashDir * 660);
    audioSynth.playJump();
    this.cameras.main.shake(120, 0.006);

    // Holographic Vector Arrow Indicators (v_dash vector VFX)
    if (this.textures.exists('vfx_vector_arrow')) {
      for (let va = 0; va < 2; va++) {
        const vArr = this.add.image(this.player.x + (dashDir * 20), this.player.y + (va * 24 - 12), 'vfx_vector_arrow');
        vArr.setDepth(14).setBlendMode(Phaser.BlendModes.ADD);
        vArr.setFlipX(dashDir < 0);
        vArr.setScale(0.85);
        vArr.setAlpha(0.9);
        this.tweens.add({
          targets: vArr,
          x: vArr.x + dashDir * 140,
          alpha: 0,
          scaleX: 1.35,
          duration: 260,
          onComplete: () => vArr.destroy()
        });
      }
    }

    // Kickback dust cloud behind hero
    for (let k = 0; k < 4; k++) {
      const kp = this.add.circle(this.player.x - dashDir * 18, this.player.y + 40 + Phaser.Math.Between(-3, 3), Phaser.Math.Between(3, 5), 0xa0aec0, 0.85);
      kp.setDepth(12);
      this.tweens.add({
        targets: kp,
        x: kp.x - dashDir * Phaser.Math.Between(20, 45),
        y: kp.y - Phaser.Math.Between(4, 12),
        alpha: 0,
        scale: 0.2,
        duration: 260,
        onComplete: () => kp.destroy()
      });
    }

    // 6 Layer Chromatic Neon Phantom Afterimages
    const spectralTints = [0x00ffff, 0x00ff88, 0x7b2cbf, 0xff006e, 0xffbe0b, 0xffffff];
    for (let i = 0; i < 6; i++) {
      this.time.delayedCall(i * 32, () => {
        if (!this.player || !this.player.active) return;
        const ghost = this.add.sprite(this.player.x, this.player.y, this.player.texture.key, this.player.frame.name);
        ghost.setScale(this.player.scaleX, this.player.scaleY);
        ghost.setFlipX(this.player.flipX);
        ghost.setAlpha(0.7 - i * 0.1);
        ghost.setTint(spectralTints[i]);
        ghost.setDepth(13);
        this.tweens.add({
          targets: ghost,
          alpha: 0,
          scaleX: this.player.scaleX * 1.12,
          duration: 260,
          onComplete: () => ghost.destroy()
        });

        // Directional Speed line streak
        const lineY = this.player.y + Phaser.Math.Between(-25, 25);
        const streak = this.add.rectangle(this.player.x - dashDir * 20, lineY, Phaser.Math.Between(50, 95), 2.5, spectralTints[i], 0.9);
        streak.setDepth(14);
        this.tweens.add({
          targets: streak,
          alpha: 0,
          scaleX: 0.1,
          duration: 220,
          onComplete: () => streak.destroy()
        });
      });
    }

    this.time.delayedCall(220, () => {
      this.isDashing = false;
    });
  }

  performPlayerAttack() {
    if (this.isAttacking) return;
    this.isAttacking = true;

    if (this.anims.exists('anim_player_attack')) {
      this.player.play('anim_player_attack');
    }
    audioSynth.playSwordSlash();

    // Dual-Blade Arc & Radial Spark Shower
    const slashOffsetX = this.player.flipX ? -55 : 55;
    const vfxKey = this.textures.exists('vfx_slash') ? 'vfx_slash' : 'vfx_crit';
    if (this.textures.exists(vfxKey)) {
      const slash = this.add.image(this.player.x + slashOffsetX, this.player.y - 12, vfxKey).setDepth(15);
      slash.setScale(0.7);
      slash.setFlipX(this.player.flipX);
      slash.setAngle(this.player.flipX ? -20 : 20);
      this.tweens.add({
        targets: slash,
        alpha: 0,
        scale: 1.4,
        angle: this.player.flipX ? 30 : -30,
        duration: 260,
        ease: 'Cubic.easeOut',
        onComplete: () => slash.destroy()
      });

      // Secondary glowing cyan energy trail
      const slash2 = this.add.image(this.player.x + slashOffsetX * 0.9, this.player.y - 10, vfxKey).setDepth(14);
      slash2.setScale(0.55);
      slash2.setTint(0x00e5ff);
      slash2.setFlipX(this.player.flipX);
      this.tweens.add({
        targets: slash2,
        alpha: 0,
        scale: 1.2,
        duration: 220,
        onComplete: () => slash2.destroy()
      });

      // 14 Directional cutting sparks
      for (let s = 0; s < 14; s++) {
        const spAngle = (this.player.flipX ? Math.PI : 0) + Phaser.Math.FloatBetween(-0.75, 0.75);
        const spDist = Phaser.Math.Between(45, 100);
        const spark = this.add.circle(this.player.x + slashOffsetX, this.player.y - 12, Phaser.Math.Between(2, 4), Phaser.Math.RND.pick([0xffd700, 0x00e5ff, 0xffffff]), 1);
        spark.setDepth(16);
        this.tweens.add({
          targets: spark,
          x: spark.x + Math.cos(spAngle) * spDist,
          y: spark.y + Math.sin(spAngle) * spDist,
          alpha: 0,
          duration: 240,
          onComplete: () => spark.destroy()
        });
      }
    }

    // Check if monster is within strike range to initiate battle
    let hitMonster = false;
    this.monsters.forEach(m => {
      if (!m.active || hitMonster) return;
      const isBoss = m.dataRef && m.dataRef.type === 'boss';
      const strikeRange = isBoss ? 195 : 140;
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, m.x, m.y);
      if (dist < strikeRange && !this.isInCombat) {
        hitMonster = true;
        this.cameras.main.shake(180, 0.012);
        audioSynth.playCritHit();
        this.startCombat(m);
      }
    });

    this.time.delayedCall(300, () => {
      this.isAttacking = false;
      if (this.player && this.player.active && this.player.body && this.player.body.touching.down && this.anims.exists('anim_player_idle')) {
        this.player.play('anim_player_idle');
      }
    });
  }

  startCombat(monsterSprite) {
    if (this.isInCombat) return;
    this.isInCombat = true;
    if (window.hideVirtualControls) window.hideVirtualControls();
    audioSynth.playMonsterAttack();

    // 1. Encounter screen slash & dramatic camera shake
    this.cameras.main.shake(220, 0.016);
    this.cameras.main.flash(200, 255, 255, 255);

    // 2. Dynamic Battle Encounter banner overlay
    const cx = this.cameras.main.scrollX + this.cameras.main.width / 2;
    const cy = this.cameras.main.scrollY + this.cameras.main.height / 2;

    const bannerBg = this.add.rectangle(cx, cy, this.cameras.main.width, 74, 0x070914, 0.88).setDepth(100);
    bannerBg.setStrokeStyle(3, 0xff0055);

    const monsterName = (monsterSprite.dataRef && monsterSprite.dataRef.name) ? monsterSprite.dataRef.name.toUpperCase() : "QUÁI VẬT";
    const encounterTxt = this.add.text(cx, cy, `⚔️ GIAO CHIẾN: ${monsterName} ⚔️`, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '900',
      fontSize: '20px',
      color: '#ffd700',
      stroke: '#ff0055',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(101);

    encounterTxt.setScale(0.2);
    this.tweens.add({
      targets: encounterTxt,
      scale: 1.1,
      duration: 220,
      ease: 'Back.easeOut'
    });

    this.time.delayedCall(380, () => {
      bannerBg.destroy();
      encounterTxt.destroy();
      this.scene.pause();
      this.scene.launch('CombatScene', {
        monsterData: monsterSprite.dataRef,
        playerX: this.player.x,
        chapter: this.currentChapter,
        question: GAME_DATA.questions[monsterSprite.dataRef.questionIndex]
      });
    });
  }

  updateHUD() {
    const p = GAME_DATA.player;
    const hpRatio = Math.max(0, p.hp / p.maxHp);
    this.hpBarFill.width = 192 * hpRatio;
    // Color shift: green → yellow → red
    if (hpRatio > 0.5) this.hpBarFill.fillColor = 0x22dd55;
    else if (hpRatio > 0.25) this.hpBarFill.fillColor = 0xffcc00;
    else this.hpBarFill.fillColor = 0xff2244;
    this.hpLabel.setText(`${Math.max(0, Math.floor(p.hp))}/${p.maxHp}`);

    let hStr = '';
    for (let i = 0; i < p.hearts; i++) hStr += '❤️';
    for (let i = p.hearts; i < 3; i++) hStr += '🖤';
    this.heartText.setText(hStr);

    const mpRatio = Math.max(0, p.mp / p.maxMp);
    this.mpBarFill.width = 192 * mpRatio;

    const expRatio = Math.max(0, p.exp / p.maxExp);
    this.expBarFill.width = 192 * expRatio;

    this.goldTxt.setText(`🪙 ${p.gold} vàng`);
    this.gemTxt.setText(`💎 ${p.gems} đá quý`);
    this.keyTxt.setText(`🗝️ ${p.keys || 1} chìa khóa`);

    // Minimap Radar — tactical grid, 360° rotating sweep beam & target blips
    this.radarGfx.clear();
    const miniX = this.cameras.main.width - 85;
    const miniY = 80;
    const radius = 45;

    // Tactical Radar Grid & Crosshairs
    this.radarGfx.lineStyle(1, 0x00e5ff, 0.22);
    this.radarGfx.strokeCircle(miniX, miniY, 18);
    this.radarGfx.strokeCircle(miniX, miniY, 32);
    this.radarGfx.strokeCircle(miniX, miniY, 45);
    this.radarGfx.beginPath();
    this.radarGfx.moveTo(miniX - radius, miniY);
    this.radarGfx.lineTo(miniX + radius, miniY);
    this.radarGfx.moveTo(miniX, miniY - radius);
    this.radarGfx.lineTo(miniX, miniY + radius);
    this.radarGfx.strokePath();

    // 360° Rotating Radar Sweep Line
    this.radarAngle = (this.radarAngle || 0) + 0.045;
    const sweepCos = Math.cos(this.radarAngle);
    const sweepSin = Math.sin(this.radarAngle);
    this.radarGfx.lineStyle(1.5, 0x00ffcc, 0.7);
    this.radarGfx.beginPath();
    this.radarGfx.moveTo(miniX, miniY);
    this.radarGfx.lineTo(miniX + sweepCos * radius, miniY + sweepSin * radius);
    this.radarGfx.strokePath();

    const pNorm = this.player.x / this.worldWidth;
    const pRadarX = miniX - radius + (pNorm * radius * 2);
    // Player dot — bright cyan/green with pulsing aura
    this.radarGfx.fillStyle(0x00e5ff, 0.4);
    this.radarGfx.fillCircle(pRadarX, miniY, 7);
    this.radarGfx.fillStyle(0x00ff99, 1);
    this.radarGfx.fillCircle(pRadarX, miniY, 4.5);
    this.radarGfx.fillStyle(0xffffff, 0.85);
    this.radarGfx.fillCircle(pRadarX, miniY - 1, 2);

    this.monsters.forEach(m => {
      if (!m.active) return;
      const mNorm = m.x / this.worldWidth;
      const mRadarX = miniX - radius + (mNorm * radius * 2);
      if (m.dataRef.type === 'boss') {
        this.radarGfx.fillStyle(0xff0033, 0.45);
        this.radarGfx.fillCircle(mRadarX, miniY, 8);
        this.radarGfx.fillStyle(0xff0033, 1);
        this.radarGfx.fillCircle(mRadarX, miniY, 5);
      } else {
        this.radarGfx.fillStyle(0xffaa00, 0.4);
        this.radarGfx.fillCircle(mRadarX, miniY, 6);
        this.radarGfx.fillStyle(0xffaa00, 1);
        this.radarGfx.fillCircle(mRadarX, miniY, 3.5);
      }
    });
  }

  drinkPotion(type) {
    if (type === 'hp') {
      if (GAME_DATA.player.hp >= GAME_DATA.player.maxHp) {
        this.showFloatingNotice(this.player.x, this.player.y - 70, 'HP đã đầy!', '#ffd700');
        return;
      }
      GAME_DATA.player.hp = Math.min(GAME_DATA.player.maxHp, GAME_DATA.player.hp + 40);
      audioSynth.playCorrect();
      this.showFloatingNotice(this.player.x, this.player.y - 70, '+40 HP', '#00ff88');
    } else {
      if (GAME_DATA.player.mp >= GAME_DATA.player.maxMp) {
        this.showFloatingNotice(this.player.x, this.player.y - 70, 'MP đã đầy!', '#ffd700');
        return;
      }
      GAME_DATA.player.mp = Math.min(GAME_DATA.player.maxMp, GAME_DATA.player.mp + 30);
      audioSynth.playCorrect();
      this.showFloatingNotice(this.player.x, this.player.y - 70, '+30 MP', '#00e5ff');
    }
    this.updateHUD();
  }
