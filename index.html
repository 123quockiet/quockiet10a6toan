      if (isArthur) {
        if (this.textures.exists('blacksmith_forge_0') || (this.textures.exists('npc') && this.textures.get('npc').has('blacksmith_forge_0'))) {
          const tex = this.textures.exists('blacksmith_forge_0') ? 'blacksmith_forge_0' : 'npc';
          const frame = this.textures.exists('blacksmith_forge_0') ? undefined : 'blacksmith_forge_0';
          pAvatar = this.add.sprite(portX, boxY + 35, tex, frame);
          pAvatar.setScale(0.5).setOrigin(0.5, 0.7);
          if (this.anims.exists('anim_blacksmith_shop')) pAvatar.play('anim_blacksmith_shop');
        } else {
          pAvatar = this.add.text(portX, boxY, '⚒️', { fontSize: '42px' }).setOrigin(0.5);
        }
      } else if (isEldrin) {
        if (this.textures.exists('wizard_greet_0') || (this.textures.exists('npc') && this.textures.get('npc').has('wizard_greet_0'))) {
          const tex = this.textures.exists('wizard_greet_0') ? 'wizard_greet_0' : 'npc';
          const frame = this.textures.exists('wizard_greet_0') ? undefined : 'wizard_greet_0';
          pAvatar = this.add.sprite(portX, boxY + 30, tex, frame);
          pAvatar.setScale(0.52).setOrigin(0.5, 0.7);
          if (this.anims.exists('anim_wizard_greet')) pAvatar.play('anim_wizard_greet');
        } else {
          pAvatar = this.add.text(portX, boxY, '🧙', { fontSize: '42px' }).setOrigin(0.5);
        }
      } else {
        if (this.textures.exists('hero_idle') || (this.textures.exists('entities') && this.textures.get('entities').has('hero_idle'))) {
          const tex = this.textures.exists('hero_idle') ? 'hero_idle' : 'entities';
          const frame = this.textures.exists('hero_idle') ? undefined : 'hero_idle';
          pAvatar = this.add.sprite(portX, boxY + 30, tex, frame);
          pAvatar.setScale(0.52).setOrigin(0.5, 0.7);
          if (this.anims.exists('hero_idle')) pAvatar.play('hero_idle');
        } else {
          pAvatar = this.add.text(portX, boxY, '⚔️', { fontSize: '42px' }).setOrigin(0.5);
        }
      }
      container.add(pAvatar);
    };

    let idx = 0;
    const textStartX = boxX - boxW / 2 + 130;
    const speaker = this.add.text(textStartX, boxY - 58, dialogueLines[0].speaker, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '800',
      fontSize: '15px',
      color: '#ffd700'
    });

    const body = this.add.text(textStartX, boxY - 26, dialogueLines[0].text, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '600',
      fontSize: '13.5px',
      color: '#ffffff',
      wordWrap: { width: boxW - 150 },
      lineSpacing: 7
    });

    // Nút chạm tiếp tục trực quan cho người dùng điện thoại
    const nextBtnPill = this.add.rectangle(boxX + boxW / 2 - 110, boxY + 54, 180, 32, 0x1a2e4c);
    nextBtnPill.setStrokeStyle(1.5, 0x00e5ff);
    nextBtnPill.setInteractive({ useHandCursor: true });
    const nextTip = this.add.text(boxX + boxW / 2 - 110, boxY + 54, 'Chạm tiếp tục ⏩', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '12px',
      color: '#00e5ff'
    }).setOrigin(0.5);

    container.add([screenDimmer, bg, innerBorder, pFrame, speaker, body, nextBtnPill, nextTip]);
    updateAvatar(dialogueLines[0].speaker);

    let keyListener;
    const advance = () => {
      audioSynth.playClick();
      idx++;
      if (idx < dialogueLines.length) {
        speaker.setText(dialogueLines[idx].speaker);
        body.setText(dialogueLines[idx].text);
        updateAvatar(dialogueLines[idx].speaker);
      } else {
        if (keyListener) this.input.keyboard.off('keydown', keyListener);
        container.destroy();
        this.isDialogueOpen = false;
        this.advanceDialogue = null;
        if (window.dimVirtualControls) window.dimVirtualControls(false);
      }
    };
    this.advanceDialogue = advance;

    keyListener = (event) => {
      if (event.key === 'e' || event.key === 'E' || event.key === ' ' || event.key === 'Enter' || event.key === 'j' || event.key === 'J') {
        advance();
      }
    };
    this.input.keyboard.on('keydown', keyListener);

    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerdown', advance);
    screenDimmer.on('pointerdown', advance);
    nextBtnPill.on('pointerdown', advance);
  }

  openShop() {
    this.isShopOpen = true;
    if (window.dimVirtualControls) window.dimVirtualControls(true);
    audioSynth.playClick();
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    const shop = this.add.container(0, 0).setScrollFactor(0).setDepth(1500);
    const dimmer = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.75).setInteractive();

    const panel = this.add.rectangle(w / 2, h / 2, 780, 460, 0x121729, 0.98);
    panel.setStrokeStyle(3, 0x00e5ff);

    const title = this.add.text(w / 2, h / 2 - 195, '🏪 Cửa hàng Thợ Rèn Arthur', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '16px',
      color: '#ffd700'
    }).setOrigin(0.5);

    // Arthur Animated Avatar in Shop Header
    if (this.textures.exists('blacksmith_shop_0') || (this.textures.exists('npc') && this.textures.get('npc').has('blacksmith_shop_0'))) {
      const aTex = this.textures.exists('blacksmith_shop_0') ? 'blacksmith_shop_0' : 'npc';
      const aFrame = this.textures.exists('blacksmith_shop_0') ? undefined : 'blacksmith_shop_0';
      const arthurAvatar = this.add.sprite(w / 2 - 310, h / 2 - 195, aTex, aFrame);
      arthurAvatar.setScale(0.38).setOrigin(0.5, 0.5);
      if (this.anims.exists('anim_blacksmith_shop')) arthurAvatar.play('anim_blacksmith_shop');
      shop.add(arthurAvatar);
    }

    shop.add([dimmer, panel, title]);

    GAME_DATA.shopItems.forEach((item, idx) => {
      const iy = h / 2 - 120 + idx * 72;
      const box = this.add.rectangle(w / 2, iy, 700, 58, 0x1c2438);
      box.setStrokeStyle(1, 0x4a6fa5);

      const itemName = this.add.text(w / 2 - 320, iy - 16, item.name, {
        fontFamily: FONT_PRIMARY,
        fontWeight: '700',
        fontSize: '13px',
        color: '#ffffff'
      });

      const itemDesc = this.add.text(w / 2 - 320, iy + 8, item.desc, {
        fontFamily: FONT_PRIMARY,
        fontWeight: '400',
        fontSize: '11px',
        color: '#a0aec0'
      });

      const buyBtn = this.add.rectangle(w / 2 + 250, iy, 140, 42, 0xffaa00);
      buyBtn.setInteractive({ useHandCursor: true });
      const buyText = this.add.text(w / 2 + 250, iy, `${item.cost} vàng`, {
        fontFamily: FONT_PRIMARY,
        fontWeight: '700',
        fontSize: '12px',
        color: '#000000'
      }).setOrigin(0.5);

      const doBuy = () => {
        if (GAME_DATA.player.gold >= item.cost) {
          GAME_DATA.player.gold -= item.cost;
          audioSynth.playCoin();
          if (item.effect.hp) GAME_DATA.player.hp = Math.min(GAME_DATA.player.maxHp, GAME_DATA.player.hp + item.effect.hp);
          if (item.effect.attack) GAME_DATA.player.attack += item.effect.attack;
          buyText.setText("Đã mua!");
          this.time.delayedCall(800, () => buyText.setText(`${item.cost} vàng`));
          this.updateHUD();
        } else {
          audioSynth.playWrong();
          buyText.setText("Thiếu vàng!");
          this.time.delayedCall(800, () => buyText.setText(`${item.cost} vàng`));
        }
      };

      buyBtn.on('pointerdown', doBuy);
      buyText.setInteractive({ useHandCursor: true });
      buyText.on('pointerdown', doBuy);

      shop.add([box, itemName, itemDesc, buyBtn, buyText]);
    });

    const closeBtn = this.add.rectangle(w / 2, h / 2 + 195, 200, 44, 0xb71c1c);
    closeBtn.setInteractive({ useHandCursor: true });
    const closeTxt = this.add.text(w / 2, h / 2 + 195, 'Đóng [Chạm để thoát]', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '13px',
      color: '#ffffff'
    }).setOrigin(0.5);

    let shopKeyListener;
    const closeShop = () => {
      audioSynth.playClick();
      if (shopKeyListener) this.input.keyboard.off('keydown', shopKeyListener);
      shop.destroy();
      this.isShopOpen = false;
      if (window.dimVirtualControls) window.dimVirtualControls(false);
    };

    shopKeyListener = (event) => {
      if (event.key === 'Escape' || event.key === 'e' || event.key === 'E' || event.key === 'x' || event.key === 'X') {
        closeShop();
      }
    };
    this.input.keyboard.on('keydown', shopKeyListener);

    closeBtn.on('pointerdown', closeShop);
    closeTxt.setInteractive({ useHandCursor: true });
    closeTxt.on('pointerdown', closeShop);
    dimmer.on('pointerdown', closeShop);

    shop.add([closeBtn, closeTxt]);
  }

  toggleInventoryModal() {
    if (this.isInventoryOpen) {
      if (this.invContainer) this.invContainer.destroy();
      this.isInventoryOpen = false;
      if (window.dimVirtualControls) window.dimVirtualControls(false);
      return;
    }

    this.isInventoryOpen = true;
    if (window.dimVirtualControls) window.dimVirtualControls(true);
    audioSynth.playClick();
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    this.invContainer = this.add.container(0, 0).setScrollFactor(0).setDepth(1500);
    const dimmer = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.8).setInteractive();

    const panel = this.add.rectangle(w / 2, h / 2, 840, 520, 0x111628, 0.98);
    panel.setStrokeStyle(3, 0xffd700);

    const title = this.add.text(w / 2, h / 2 - 225, '⚔️ Bảng Quản Lý Nhân Vật (Kael) ⚔️', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '16px',
      color: '#ffd700'
    }).setOrigin(0.5);

    // Left Half: TÚI ĐỒ & TRANG BỊ
    const leftCard = this.add.rectangle(w / 2 - 200, h / 2 - 20, 380, 340, 0x1b233a);
    leftCard.setStrokeStyle(2, 0x4a6fa5);

    const invTitle = this.add.text(w / 2 - 200, h / 2 - 165, '🎒 Túi Đồ (Chạm bình máu để uống)', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '13px',
      color: '#00e5ff'
    }).setOrigin(0.5);

    const eqText = [
      `• Mũ: ${GAME_DATA.player.equipment.helmet}`,
      `• Giáp: ${GAME_DATA.player.equipment.armor}`,
      `• Vũ khí: ${GAME_DATA.player.equipment.sword}`,
      `• Khiên: ${GAME_DATA.player.equipment.shield}`
    ];
    const eqLabel = this.add.text(w / 2 - 370, h / 2 - 130, eqText.join('\n\n'), {
      fontFamily: FONT_PRIMARY,
      fontWeight: '500',
      fontSize: '12px',
      color: '#ffffff',
      lineSpacing: 6
    });

    const invItemsList = [];
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 4; c++) {
        const itemIdx = r * 4 + c;
        const slot = this.add.rectangle(w / 2 - 340 + c * 75, h / 2 + 30 + r * 60, 60, 48, 0x2a3552);
        slot.setStrokeStyle(1, 0x64748b);
        invItemsList.push(slot);

        const item = GAME_DATA.player.inventory[itemIdx];
        if (item) {
          const iconTxt = this.add.text(w / 2 - 340 + c * 75, h / 2 + 25 + r * 60, item.icon, { fontSize: '18px' }).setOrigin(0.5);
          const countTxt = this.add.text(w / 2 - 340 + c * 75, h / 2 + 45 + r * 60, `x${item.count}`, { fontFamily: FONT_PRIMARY, fontWeight: '600', fontSize: '12px', color: '#ffd700' }).setOrigin(0.5);
          invItemsList.push(iconTxt, countTxt);

          // Chạm trực tiếp vào bình máu/mana trên điện thoại để uống ngay
          if (item.type === 'consumable') {
            slot.setStrokeStyle(1.5, 0x00ff88);
            slot.setInteractive({ useHandCursor: true });
            iconTxt.setInteractive({ useHandCursor: true });
            const useConsumable = () => {
              if (item.id === 'pot_hp') this.drinkPotion('hp');
              else if (item.id === 'pot_mp') this.drinkPotion('mp');
              if (item.count > 1) {
                item.count--;
              } else {
                GAME_DATA.player.inventory.splice(itemIdx, 1);
              }
              // Làm mới hiển thị túi đồ
              this.toggleInventoryModal();
              this.toggleInventoryModal();
            };
            slot.on('pointerdown', useConsumable);
            iconTxt.on('pointerdown', useConsumable);
          }
        }
      }
    }

    // Right Half: CHỈ SỐ & NHIỆM VỤ
    const rightCard = this.add.rectangle(w / 2 + 200, h / 2 - 20, 380, 340, 0x1b233a);
    rightCard.setStrokeStyle(2, 0x4a6fa5);

    const statsTitle = this.add.text(w / 2 + 200, h / 2 - 165, '📊 Bảng Chỉ Số & Nhiệm Vụ', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '13px',
      color: '#ffd700'
    }).setOrigin(0.5);

    const stats = [
      `❤️ Máu (HP): ${Math.floor(GAME_DATA.player.hp)}/${GAME_DATA.player.maxHp}`,
      `💧 Mana (MP): ${GAME_DATA.player.mp}/${GAME_DATA.player.maxMp}`,
      `⚔️ Sức tấn công (ATK): ${GAME_DATA.player.attack}`,
      `🛡️ Giáp phòng ngự (DEF): ${GAME_DATA.player.defense}`,
      `🏃 Tốc độ di chuyển (SPD): 12`,
      `💥 Tỉ lệ chí mạng (CRIT): ${GAME_DATA.player.crit}%`,
      `--------------------------`,
      `📜 Nhiệm vụ: Tiêu diệt 15 Quái Vật`,
      `• Tiến độ: ${window.defeatedMonsters.length}/15 quái vật`,
      `• Phần thưởng: 500 vàng + Hạt Giống Tro Tàn`
    ];

    const statsLabel = this.add.text(w / 2 + 30, h / 2 - 135, stats.join('\n'), {
      fontFamily: FONT_PRIMARY,
      fontWeight: '500',
      fontSize: '12px',
      color: '#ffffff',
      lineSpacing: 5
    });

    const closeBtn = this.add.rectangle(w / 2, h / 2 + 215, 220, 44, 0xb71c1c);
    closeBtn.setInteractive({ useHandCursor: true });
    const closeTxt = this.add.text(w / 2, h / 2 + 215, 'Đóng [Chạm để thoát]', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '13px',
      color: '#ffffff'
    }).setOrigin(0.5);

    const closeInv = () => this.toggleInventoryModal();
    closeBtn.on('pointerdown', closeInv);
    closeTxt.setInteractive({ useHandCursor: true });
    closeTxt.on('pointerdown', closeInv);
    dimmer.on('pointerdown', closeInv);

    this.invContainer.add([dimmer, panel, title, leftCard, invTitle, eqLabel, ...invItemsList, rightCard, statsTitle, statsLabel, closeBtn, closeTxt]);
  }
}

// ----------------------------------------------------------------------------
// 6. COMBAT SCENE (QUIZ COMBAT UI - GIỐNG CÂU HỎI.PNG & GIAO DIỆN 5.PNG 100%)
// ----------------------------------------------------------------------------
class CombatScene extends Phaser.Scene {
  constructor() {
    super('CombatScene');
  }

  init(data) {
    this.monsterData = data.monsterData;
    this.playerX = data.playerX;
    this.question = data.question;
    this.timeLeft = 20;
    this.timerEvent = null;
    this.isAnswering = false;
  }

  create() {
    this.scale.refresh();
    if (window.hideVirtualControls) window.hideVirtualControls();
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    // 1. Chapter Ambient Background & Cinematic Vignette
    const chapter = this.monsterData.chapter || 1;
    const bgKey = chapter === 2 ? 'bg_map2' : 'bg_map1';
    if (this.textures.exists(bgKey)) {
      const battleBg = this.add.image(w / 2, h / 2, bgKey);
      battleBg.setDisplaySize(w, h).setAlpha(0.38).setDepth(0);
    }

    // Dark cinematic vignette overlay
    this.add.rectangle(w / 2, h / 2, w, h, 0x060914, 0.84).setDepth(1);

    // Floating arena dust motes
    for (let di = 0; di < 14; di++) {
      const dm = this.add.circle(Phaser.Math.Between(40, w - 40), Phaser.Math.Between(50, 400), Phaser.Math.Between(1.5, 3), 0x00e5ff, 0.6);
      dm.setDepth(1);
      this.tweens.add({
        targets: dm,
        y: dm.y - Phaser.Math.Between(25, 60),
        x: dm.x + Phaser.Math.Between(-20, 20),
        alpha: 0.1,
        duration: Phaser.Math.Between(2000, 3600),
        repeat: -1,
        yoyo: true
      });
    }

    // Holographic Cartesian Coordinate Grid in Battle Arena Background
    const gridGfx = this.add.graphics().setDepth(2);
    gridGfx.lineStyle(1, 0x00e5ff, 0.12);
    const gridLeft = w / 2 - 340;
    const gridRight = w / 2 + 340;
    const gridTop = 60;
    const combatGroundY = 415;
    for (let gx = gridLeft; gx <= gridRight; gx += 40) {
      gridGfx.beginPath();
      gridGfx.moveTo(gx, gridTop);
      gridGfx.lineTo(gx, combatGroundY);
      gridGfx.strokePath();
    }
    for (let gy = gridTop; gy <= combatGroundY; gy += 40) {
      gridGfx.beginPath();
      gridGfx.moveTo(gridLeft, gy);
      gridGfx.lineTo(gridRight, gy);
      gridGfx.strokePath();
    }
    // Prominent Ox & Oy Vector Axes
    gridGfx.lineStyle(2, 0x00e5ff, 0.35);
    const axisY = 260;
    gridGfx.beginPath();
    gridGfx.moveTo(gridLeft, axisY);
    gridGfx.lineTo(gridRight, axisY);
    gridGfx.moveTo(w / 2, gridTop);
    gridGfx.lineTo(w / 2, combatGroundY);
    gridGfx.strokePath();
    this.add.text(gridRight - 15, axisY - 18, 'x⃗', { fontFamily: FONT_PRIMARY, fontSize: '13px', color: '#00e5ff' }).setDepth(2).setAlpha(0.65);
    this.add.text(w / 2 + 10, gridTop + 5, 'y⃗', { fontFamily: FONT_PRIMARY, fontSize: '13px', color: '#00e5ff' }).setDepth(2).setAlpha(0.65);
    this.add.text(w / 2 + 6, axisY + 4, 'O', { fontFamily: FONT_PRIMARY, fontSize: '11px', color: '#00e5ff' }).setDepth(2).setAlpha(0.5);

    // 2. Grand Arena Battle Stage at y = 415
    // Stage drop shadow
    this.add.rectangle(w / 2, combatGroundY + 40, w - 60, 10, 0x000000, 0.65).setDepth(1);
    // Deep stone slab base
    this.add.rectangle(w / 2, combatGroundY + 20, w - 70, 36, 0x141824).setDepth(2);
    // Polished stone surface
    this.add.rectangle(w / 2, combatGroundY + 4, w - 70, 8, 0x252e42).setDepth(2);
    // Cyan Runic Border
    this.add.rectangle(w / 2, combatGroundY + 1, w - 70, 2, 0x00e5ff).setDepth(3);

    // Left and Right Arena Torch Pillars
    const leftPillar = this.add.rectangle(48, combatGroundY - 6, 16, 52, 0x1e2638).setDepth(3);
    const rightPillar = this.add.rectangle(w - 48, combatGroundY - 6, 16, 52, 0x1e2638).setDepth(3);
    const leftBrazier = this.add.circle(48, combatGroundY - 36, 10, 0x00e5ff, 0.7).setDepth(4);
    const rightBrazier = this.add.circle(w - 48, combatGroundY - 36, 10, 0xff0055, 0.7).setDepth(4);
    this.tweens.add({
      targets: [leftBrazier, rightBrazier],
      scale: { from: 0.85, to: 1.25 },
      alpha: { from: 0.45, to: 0.9 },
      duration: 350,
      yoyo: true,
      repeat: -1
    });

    // 3. Kael Ground Contact Shadow & Magic Rune Circle
    this.add.ellipse(220, combatGroundY, 70, 16, 0x000000, 0.55).setDepth(3);

    // Dual Counter-Rotating Summon Runes under Kael
    if (this.textures.exists('vfx_runic_ring_gold')) {
      const pRuneGold = this.add.image(220, combatGroundY - 4, 'vfx_runic_ring_gold');
      pRuneGold.setScale(1.1, 0.34).setAlpha(0.48).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
      this.tweens.add({
        targets: pRuneGold,
        rotation: -Math.PI * 2,
        duration: 12000,
        repeat: -1
      });
    }

    if (this.textures.exists('vfx_magic_rune')) {
      const playerRune = this.add.image(220, combatGroundY - 4, 'vfx_magic_rune');
      playerRune.setScale(0.85, 0.28).setTint(0x00e5ff).setAlpha(0.7).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
      this.tweens.add({
        targets: playerRune,
        rotation: Math.PI * 2,
        duration: 8000,
        repeat: -1
      });
    }

    // Ambient Hero Light Halo
    if (this.textures.exists('vfx_light_halo')) {
      const pHalo = this.add.image(220, combatGroundY - 70, 'vfx_light_halo');
      pHalo.setScale(0.95).setAlpha(0.28).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
      this.tweens.add({
        targets: pHalo,
        scale: { from: 0.9, to: 1.05 },
        alpha: { from: 0.2, to: 0.35 },
        duration: 1300,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });
    }

    // Kael on the Left standing firmly on platform
    this.playerSprite = this.add.sprite(220, combatGroundY, 'player_idle_0');
    this.playerSprite.setOrigin(0.5, 1);
    this.playerSprite.setScale(0.85);
    this.playerSprite.setDepth(5);
    if (this.anims.exists('anim_player_idle')) this.playerSprite.play('anim_player_idle');

    const playerH = this.playerSprite.displayHeight || 160;
    this.add.text(220, combatGroundY - playerH - 25, 'Kael - Hiệp Sĩ', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '800',
      fontSize: '12px',
      color: '#00e5ff'
    }).setOrigin(0.5).setDepth(6);

    // 4. Monster on the Right
    let monTex = 'mon_' + this.monsterData.id;
    let monFrame = undefined;
    if (!this.textures.exists(monTex)) {
      if (this.textures.exists('entities') && this.textures.get('entities').has(monTex)) {
        monFrame = monTex;
        monTex = 'entities';
      } else if (this.monsterData.id === 'malakar_p1') {
        monTex = this.textures.exists('mon_malakar_p1') ? 'mon_malakar_p1' : (this.textures.exists('mon_boss_malakar') ? 'mon_boss_malakar' : 'entities');
        if (monTex === 'entities') monFrame = 'mon_boss_malakar';
      } else if (this.monsterData.id === 'malakar_p2') {
        monTex = this.textures.exists('mon_malakar_p2') ? 'mon_malakar_p2' : (this.textures.exists('mon_boss_malakar_p2') ? 'mon_boss_malakar_p2' : 'entities');
        if (monTex === 'entities') monFrame = 'mon_boss_malakar_p2';
      } else if (this.monsterData.id === 'orc_armor') {
        monTex = this.textures.exists('mon_orc_armor') ? 'mon_orc_armor' : (this.textures.exists('mon_orc_axe') ? 'mon_orc_axe' : 'entities');
        if (monTex === 'entities') monFrame = 'mon_orc_axe';
      } else if (this.monsterData.id === 'orc_shaman') {
        monTex = this.textures.exists('mon_orc_shaman') ? 'mon_orc_shaman' : (this.textures.exists('mon_orc_enrage') ? 'mon_orc_enrage' : 'entities');
        if (monTex === 'entities') monFrame = 'mon_orc_enrage';
      } else if (this.monsterData.type === 'boss') {
        monTex = this.textures.exists('mon_boss_malakar') ? 'mon_boss_malakar' : 'entities';
        if (monTex === 'entities') monFrame = 'mon_boss_malakar';
      } else if (this.monsterData.type === 'medium') {
        monTex = this.textures.exists('mon_orc_axe') ? 'mon_orc_axe' : 'entities';
        if (monTex === 'entities') monFrame = 'mon_orc_axe';
      } else {
        monTex = 'mon_slime';
      }
    }

    const isBoss = this.monsterData.type === 'boss';
    const isMedium = this.monsterData.type === 'medium';
    const isFlying = (this.monsterData.id === 'bat' || this.monsterData.id === 'bat_vampire' || this.monsterData.id === 'shadow_phoenix' || this.monsterData.id === 'frost_wraith' || this.monsterData.id === 'void_ghast' || this.monsterData.id === 'storm_harpy');
    let mScale = isBoss ? 1.25 : (isMedium ? 1.05 : 0.95);
    if (this.monsterData.id === 'shadow_phoenix') mScale = 1.35;
    else if (this.monsterData.id === 'ancient_golem') mScale = 1.15;
    else if (this.monsterData.id === 'infernal_demon') mScale = 1.05;
    else if (this.monsterData.id === 'acid_basilisk') mScale = 1.1;
    else if (this.monsterData.id === 'frost_wraith') mScale = 1.05;
    else if (this.monsterData.id === 'magma_crusher') mScale = 1.35;
    else if (this.monsterData.id === 'cyclops_berserker') mScale = 1.20;
    else if (this.monsterData.id === 'thorny_behemoth') mScale = 1.05;
    else if (this.monsterData.id === 'plague_wyrm') mScale = 1.05;
    else if (this.monsterData.id === 'shadow_stalker') mScale = 1.0;
    else if (this.monsterData.id === 'skeleton_warrior') mScale = 1.0;
    else if (this.monsterData.id === 'toxic_slime') mScale = 0.95;
    else if (this.monsterData.id === 'void_ghast') mScale = 1.0;
    else if (this.monsterData.id === 'frost_fang') mScale = 1.0;
    else if (this.monsterData.id === 'storm_harpy') mScale = 1.15;

    // Monster Contact Shadow
    const monShadowW = mScale * 80;
    const monShadow = this.add.ellipse(w - 240, combatGroundY, monShadowW, 18, 0x000000, 0.55).setDepth(3);

    // Dual Counter-Rotating Dark Void Runic Circles under Monster
    if (this.textures.exists('vfx_runic_ring_gold')) {
      const monRuneOuter = this.add.image(w - 240, combatGroundY - 4, 'vfx_runic_ring_gold');
      const outerTint = this.monsterData.id === 'magma_crusher' ? 0xff4400 : (isBoss ? 0x9333ea : 0xe11d48);
      monRuneOuter.setScale(mScale * 1.25, 0.35).setTint(outerTint).setAlpha(0.48).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
      this.tweens.add({
        targets: monRuneOuter,
        rotation: Math.PI * 2,
        duration: 11000,
        repeat: -1
      });
    }

    if (this.textures.exists('vfx_magic_rune')) {
      const monRune = this.add.image(w - 240, combatGroundY - 4, 'vfx_magic_rune');
      const runeTint = this.monsterData.id === 'magma_crusher' ? 0xff2200 : (this.monsterData.id === 'cyclops_berserker' ? 0xff6600 : (isBoss ? 0xa855f7 : 0xff3366));
      monRune.setScale(mScale * 0.95, 0.28).setTint(runeTint).setAlpha(0.7).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
      this.tweens.add({
        targets: monRune,
        rotation: -Math.PI * 2,
        duration: 8000,
        repeat: -1
      });
    }

    // Elemental Ambient Particles for Monster
    if (this.monsterData.id === 'acid_basilisk' || this.monsterData.id === 'slime' || this.monsterData.id === 'toxic_slime') {
      for (let gi = 0; gi < 8; gi++) {
        const gp = this.add.circle(w - 240 + Phaser.Math.Between(-35, 35), combatGroundY - Phaser.Math.Between(10, 45), Phaser.Math.Between(2, 4), 0x39ff14, 0.85).setDepth(6);
        this.tweens.add({ targets: gp, y: gp.y - Phaser.Math.Between(30, 60), alpha: 0, scale: 0.2, duration: 650 + gi * 100, repeat: -1 });
      }
    } else if (this.monsterData.id === 'infernal_demon' || this.monsterData.id === 'slime_fire' || this.monsterData.id === 'magma_crusher') {
      for (let fi = 0; fi < 10; fi++) {
        const fp = this.add.circle(w - 240 + Phaser.Math.Between(-45, 45), combatGroundY - Phaser.Math.Between(15, 60), Phaser.Math.Between(2, 5), 0xff3300, 0.9).setDepth(6);
        this.tweens.add({ targets: fp, y: fp.y - Phaser.Math.Between(35, 80), alpha: 0, scale: 0.2, duration: 700 + fi * 110, repeat: -1 });
      }
    } else if (this.monsterData.id === 'frost_wraith' || this.monsterData.id === 'mushroom_crystal' || this.monsterData.id === 'frost_fang') {
      for (let ci = 0; ci < 8; ci++) {
        const cp = this.add.circle(w - 240 + Phaser.Math.Between(-35, 35), combatGroundY - Phaser.Math.Between(20, 70), Phaser.Math.Between(2, 4), 0x00e5ff, 0.85).setDepth(6);
        this.tweens.add({ targets: cp, y: cp.y - 35, alpha: 0.1, duration: 850 + ci * 120, repeat: -1, yoyo: true });
      }
    } else if (this.monsterData.id === 'ancient_golem' || this.monsterData.id === 'thorny_behemoth' || this.monsterData.id === 'cyclops_berserker') {
      for (let gi = 0; gi < 7; gi++) {
        const gp = this.add.circle(w - 240 + Phaser.Math.Between(-40, 40), combatGroundY - Phaser.Math.Between(15, 65), Phaser.Math.Between(2, 4.5), 0xfacc15, 0.85).setDepth(6);
        this.tweens.add({ targets: gp, y: gp.y - 30, alpha: 0.1, duration: 900 + gi * 130, repeat: -1, yoyo: true });
      }
    } else if (this.monsterData.id === 'shadow_phoenix' || this.monsterData.id === 'shadow_stalker' || this.monsterData.id === 'void_ghast') {
      for (let pi = 0; pi < 12; pi++) {
        const pp = this.add.circle(w - 240 + Phaser.Math.Between(-45, 45), combatGroundY - Phaser.Math.Between(30, 85), Phaser.Math.Between(2, 4.5), 0xa855f7, 0.85).setDepth(6);
        this.tweens.add({ targets: pp, y: pp.y - 45, alpha: 0, duration: 750 + pi * 80, repeat: -1 });
      }
    } else if (this.monsterData.id === 'skeleton_warrior') {
      for (let si = 0; si < 6; si++) {
        const sp = this.add.circle(w - 240 + Phaser.Math.Between(-35, 35), combatGroundY - Phaser.Math.Between(20, 65), Phaser.Math.Between(2, 4), 0xdc2626, 0.85).setDepth(6);
        this.tweens.add({ targets: sp, y: sp.y - 40, alpha: 0, duration: 850 + si * 100, repeat: -1 });
      }
    } else if (this.monsterData.id === 'plague_wyrm') {
      for (let pi = 0; pi < 8; pi++) {
        const pp = this.add.circle(w - 240 + Phaser.Math.Between(-35, 35), combatGroundY - Phaser.Math.Between(15, 60), Phaser.Math.Between(2, 4), 0x22c55e, 0.85).setDepth(6);
        this.tweens.add({ targets: pp, y: pp.y - 40, alpha: 0, duration: 800 + pi * 90, repeat: -1 });
      }
    }

    // Swirling Dark Void / Magma Aura for Bosses
    if (isBoss) {
      const bossAuraColor = this.monsterData.id === 'magma_crusher' ? 0xff3300 : (this.monsterData.id === 'cyclops_berserker' ? 0xff6600 : 0x7c3aed);
      for (let bp = 0; bp < 16; bp++) {
        const bpAng = (bp / 16) * Math.PI * 2;
        const bprad = Phaser.Math.Between(45, 95);
        const shadowP = this.add.circle(w - 240 + Math.cos(bpAng) * bprad, combatGroundY - 80 + Math.sin(bpAng) * bprad, Phaser.Math.Between(2, 4), bossAuraColor, 0.75);
        shadowP.setDepth(4);
        this.tweens.add({
          targets: shadowP,
          scale: 0.2,
          alpha: 0.15,
          duration: 1400 + bp * 100,
          repeat: -1,
          yoyo: true
        });
      }
    }

    const monsterStartY = isFlying ? (combatGroundY - 50) : combatGroundY;
    this.monsterSprite = this.add.sprite(w - 240, monsterStartY, monTex, monFrame);
    this.monsterSprite.setOrigin(0.5, 1);
    this.monsterSprite.setScale(mScale);
    this.monsterSprite.setDepth(5);

    // Face left towards Kael if naturally facing right
    const flipList = [
      'acid_basilisk', 'infernal_demon', 'ancient_golem', 'shadow_phoenix', 'panther',
      'mushroom', 'mushroom_crystal', 'skeleton_warrior', 'toxic_slime', 'shadow_stalker',
      'plague_wyrm', 'thorny_behemoth', 'cyclops_berserker', 'magma_crusher',
      'void_ghast', 'frost_fang', 'storm_harpy'
    ];
    if (flipList.includes(this.monsterData.id)) {
      this.monsterSprite.setFlipX(true);
    }

    // Flying monster hovering animation
    if (isFlying) {
      this.tweens.add({
        targets: this.monsterSprite,
        y: combatGroundY - 75,
        duration: 520,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });
      this.tweens.add({
        targets: monShadow,
        scaleX: 0.75,
        scaleY: 0.75,
        alpha: 0.35,
        duration: 520,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });
    }

    const monH = this.monsterSprite.displayHeight || 160;
    const monUiY = Math.min(combatGroundY - monH - 20, 260);

    this.add.text(w - 240, monUiY - 25, this.monsterData.name, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '800',
      fontSize: '12px',
      color: this.monsterData.type === 'boss' ? '#ff3366' : '#ffaa00'
    }).setOrigin(0.5).setDepth(6);

    // Monster HP Bar in Combat
    this.monHpBarFill = this.add.rectangle(w - 330, monUiY, 180, 14, 0xff2244).setOrigin(0, 0.5).setDepth(6);
    const monHpBarBg = this.add.rectangle(w - 240, monUiY, 180, 14, 0x330000).setDepth(5);
    monHpBarBg.setStrokeStyle(1, 0xffffff);

    this.monHpText = this.add.text(w - 240, monUiY, `${this.monsterData.hp} HP`, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '10.5px',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(7);

    // Boss Giant HP Bar Banner
    if (this.monsterData.type === 'boss') {
      const bossBarBox = this.add.rectangle(w / 2, 45, 780, 48, 0x1a0510, 0.95).setDepth(10);
      bossBarBox.setStrokeStyle(3, 0xff0044);
      this.add.text(w / 2, 45, `👑 ${this.monsterData.name.toUpperCase()} - HP: ${this.monsterData.hp.toLocaleString('vi-VN')} / ${this.monsterData.maxHp.toLocaleString('vi-VN')} 👑`, {
        fontFamily: FONT_PRIMARY,
        fontWeight: '700',
        fontSize: '13px',
        color: '#ff2255'
      }).setOrigin(0.5).setDepth(11);
    }

    this.createQuizUI();
    this.startTimer();
  }

  createQuizUI() {
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    const boxY = h - 165;
    // Main quiz background box with high depth and vivid borders
    const qBox = this.add.rectangle(w / 2, boxY, w - 60, 240, 0x070c18, 0.98).setDepth(25);
    qBox.setStrokeStyle(3, 0xffd700);

    // Decorative inner border for gaming feel
    const innerBorder = this.add.rectangle(w / 2, boxY, w - 72, 228).setDepth(25);
    innerBorder.setStrokeStyle(1, 0x00e5ff, 0.45);

    // Monster & Topic Header Badge
    const headerBg = this.add.rectangle(w / 2, boxY - 95, 480, 26, 0x121b30, 0.95).setDepth(26);
    headerBg.setStrokeStyle(1.5, 0xffd700, 0.9);
    this.add.text(w / 2, boxY - 95, `[ ${this.question.monsterTitle} ]`, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '800',
      fontSize: '14.5px', color: '#ffd700', stroke: '#000000', strokeThickness: 2 }).setOrigin(0.5).setDepth(27);

    const timerW = 380;
    this.timerBarBg = this.add.rectangle(w / 2, boxY - 70, timerW, 10, 0x1a2234).setDepth(26);
    this.timerBarBg.setStrokeStyle(1, 0x334155);
    this.timerBarFill = this.add.rectangle(w / 2 - timerW / 2, boxY - 70, timerW, 10, 0x00ff88).setOrigin(0, 0.5).setDepth(27);
    this.timerText = this.add.text(w / 2 + timerW / 2 + 25, boxY - 70, '20s', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '800',
      fontSize: '14.5px', color: '#00ff88', stroke: '#000000', strokeThickness: 2 }).setOrigin(0, 0.5).setDepth(27);

    // High-contrast, large, bold question text (Completely crisp and legible)
    this.qText = this.add.text(w / 2, boxY - 40, this.question.question, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '800',
      fontSize: '16.5px', color: '#ffffff',
      align: 'center',
      wordWrap: { width: w - 120 },
      lineSpacing: 6,
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(26);

    this.optionButtons = [];
    const positions = [
      { x: w / 2 - 280, y: boxY + 18 },
      { x: w / 2 + 280, y: boxY + 18 },
      { x: w / 2 - 280, y: boxY + 74 },
      { x: w / 2 + 280, y: boxY + 74 }
    ];

    const badges = ['A', 'B', 'C', 'D'];

    this.question.options.forEach((optText, idx) => {
      const pos = positions[idx];
      const btnBg = this.add.rectangle(pos.x, pos.y, 510, 46, 0x11192d, 0.98).setDepth(26);
      btnBg.setStrokeStyle(2, 0x3b82f6);

      // Distinct Badge Pill for A, B, C, D
      const badgePill = this.add.rectangle(pos.x - 225, pos.y, 28, 28, 0x1d2846).setDepth(27);
      badgePill.setStrokeStyle(1.5, 0x00e5ff);
      const badgeTxt = this.add.text(pos.x - 225, pos.y, badges[idx], {
        fontFamily: FONT_PRIMARY,
        fontWeight: '900',
        fontSize: '14px', color: '#00e5ff' }).setOrigin(0.5).setDepth(28);

      // Clean, bright white option answer text
      const cleanOptText = optText.replace(/^[A-D]\.\s*/, '');
      const label = this.add.text(pos.x - 198, pos.y, cleanOptText, {
        fontFamily: FONT_PRIMARY,
        fontWeight: '700',
        fontSize: '14.5px', color: '#f8fafc',
        align: 'left',
        wordWrap: { width: 440 },
        stroke: '#000000',
        strokeThickness: 2
      }).setOrigin(0, 0.5).setDepth(27);

      const triggerSelect = () => {
        if (this.isAnswering) return;
        this.selectAnswer(idx, btnBg, label);
      };

      btnBg.setInteractive({ useHandCursor: true });
      badgePill.setInteractive({ useHandCursor: true });
      badgeTxt.setInteractive({ useHandCursor: true });
      label.setInteractive({ useHandCursor: true });

      btnBg.on('pointerover', () => {
        if (this.isAnswering) return;
        btnBg.fillColor = 0x1c2b4d;
        btnBg.setStrokeStyle(3, 0xffd700);
        badgePill.fillColor = 0xffd700;
        badgeTxt.setColor('#0a0d18');
        label.setColor('#ffea00');
        audioSynth.playClick();
      });

      btnBg.on('pointerout', () => {
        if (this.isAnswering) return;
        btnBg.fillColor = 0x11192d;
        btnBg.setStrokeStyle(2, 0x3b82f6);
        badgePill.fillColor = 0x1d2846;
        badgeTxt.setColor('#00e5ff');
        label.setColor('#f8fafc');
      });

      btnBg.on('pointerdown', triggerSelect);
      badgePill.on('pointerdown', triggerSelect);
      badgeTxt.on('pointerdown', triggerSelect);
      label.on('pointerdown', triggerSelect);

      this.optionButtons.push({ bg: btnBg, label, badgePill, badgeTxt, originalText: optText });
    });
  }

  startTimer() {
    this.timeLeft = 20;
    this.timerEvent = this.time.addEvent({
      delay: 1000,
      repeat: 20,
      callback: () => {
        if (this.isAnswering) return;
        this.timeLeft--;
        const ratio = Math.max(0, this.timeLeft / 20);
        this.timerBarFill.width = 380 * ratio;

        if (this.timeLeft <= 5) {
          this.timerBarFill.fillColor = 0xff2244;
          this.timerText.setColor('#ff2244');
          this.tweens.add({
            targets: this.timerText,
            scale: 1.25,
            duration: 130,
            yoyo: true
          });
        } else if (this.timeLeft <= 10) {
          this.timerBarFill.fillColor = 0xffaa00;
          this.timerText.setColor('#ffaa00');
        }

        this.timerText.setText(`${this.timeLeft}s`);

        if (this.timeLeft <= 0) {
          this.handleTimeout();
        }
      }
    });
  }

  selectAnswer(selectedIdx, btnBg, label) {
    this.isAnswering = true;
    if (this.timerEvent) this.timerEvent.remove();

    const isCorrect = selectedIdx === this.question.correct;

    if (isCorrect) {
      btnBg.fillColor = 0x10552b;
      btnBg.setStrokeStyle(3, 0x00ff88);
      label.setText(`[Đúng! ✔] ` + this.question.options[selectedIdx]);
      label.setColor('#00ff88');

      // 1. Celebratory Expanding Emerald Ring around Answer Button
      const ring = this.add.circle(btnBg.x, btnBg.y, 25);
      ring.setStrokeStyle(4, 0x00ff88, 0.95);
      ring.setDepth(21);
      this.tweens.add({
        targets: ring,
        radius: 120,
        alpha: 0,
        duration: 450,
        ease: 'Quad.easeOut',
        onComplete: () => ring.destroy()
      });

      // 2. 6 Glowing Floating Mathematical Vector Formulas
      const runes = ['[u⃗ + v⃗]', '|a⃗|', 'cos θ = 1', 'k·v⃗', '[x, y]', '0⃗'];
      runes.forEach((rText, ri) => {
        const rx = btnBg.x + (ri - 2.5) * 48;
        const ry = btnBg.y - 15;
        const rColor = Phaser.Math.RND.pick(['#00ff88', '#00e5ff', '#ffd700', '#f687b3']);
        const rObj = this.add.text(rx, ry, rText, {
          fontFamily: FONT_PRIMARY,
          fontWeight: '700',
          fontSize: '13px',
          color: rColor,
          stroke: '#000000',
          strokeThickness: 3
        }).setOrigin(0.5).setDepth(22);
        this.tweens.add({
          targets: rObj,
          y: ry - Phaser.Math.Between(55, 95),
          x: rx + Phaser.Math.Between(-20, 20),
          alpha: 0,
          scale: 1.25,
          duration: 700 + ri * 80,
          ease: 'Back.easeOut',
          onComplete: () => rObj.destroy()
        });
      });

      // 3. Celebratory button sparkle burst
      for (let c = 0; c < 18; c++) {
        const cAngle = (c / 18) * Math.PI * 2;
        const cDist = Phaser.Math.Between(40, 110);
        const cf = this.add.circle(btnBg.x, btnBg.y, Phaser.Math.Between(2, 4), Phaser.Math.RND.pick([0x00ff88, 0xffd700, 0x00e5ff]), 1).setDepth(20);
        this.tweens.add({
          targets: cf,
          x: btnBg.x + Math.cos(cAngle) * cDist,
          y: btnBg.y + Math.sin(cAngle) * cDist,
          alpha: 0,
          scale: 0.2,
          duration: 380,
          onComplete: () => cf.destroy()
        });
      }

      // 4. Holographic Vector Arrow Strike across the battle stage
      if (this.textures.exists('vfx_vector_arrow')) {
        const combatGroundY = 415;
        const vBeam = this.add.image(220, combatGroundY - 70, 'vfx_vector_arrow');
        vBeam.setScale(1.5, 1.1).setBlendMode(Phaser.BlendModes.ADD).setDepth(23).setAlpha(0.95);
        this.tweens.add({
          targets: vBeam,
          x: w - 240,
          scaleX: 2.1,
          alpha: { from: 1, to: 0 },
          duration: 320,
          ease: 'Cubic.easeIn',
          onComplete: () => vBeam.destroy()
        });
      }

      this.cameras.main.flash(140, 0, 255, 136, false);
      audioSynth.playCorrect();
      this.time.delayedCall(450, () => this.executePlayerAttack());
    } else {
      btnBg.fillColor = 0x5a1020;
      btnBg.setStrokeStyle(3, 0xff2244);
      label.setText(`[Sai! ✖] ` + this.question.options[selectedIdx]);
      label.setColor('#ff2244');

      const correctBtn = this.optionButtons[this.question.correct];
      correctBtn.bg.setStrokeStyle(3, 0x00ff88);
      correctBtn.label.setColor('#00ff88');

      audioSynth.playWrong();
      this.time.delayedCall(600, () => this.executeMonsterAttack());
    }
  }

  handleTimeout() {
    this.isAnswering = true;
    this.timerText.setText("Hết giờ!");
    audioSynth.playWrong();

    const correctBtn = this.optionButtons[this.question.correct];
    correctBtn.bg.setStrokeStyle(3, 0x00ff88);
    correctBtn.label.setColor('#00ff88');

    this.time.delayedCall(600, () => this.executeMonsterAttack());
  }

  executePlayerAttack() {
    if (this.anims.exists('anim_player_attack')) {
      this.playerSprite.play('anim_player_attack');
    }
    audioSynth.playSwordSlash();

    const w = this.cameras.main.width;
    const startX = this.playerSprite.x;
    const monX = this.monsterSprite.x;
    const monMidY = this.monsterSprite.y - (this.monsterSprite.displayHeight / 2);
    const isBoss = this.monsterData.type === 'boss';

    // 1. DYNAMIC HERO SKILL SELECTION
    const skillPool = [
      { name: "⚡ LÔI QUANG VECTƠ TRẢM ⚡", color: "#00e5ff", stroke: "#003388" },
      { name: "🔥 HỎA PHƯỢNG LIỆT ĐỊA TRẢM 🔥", color: "#ff6600", stroke: "#661100" },
      { name: "✨ VÔ CỰC TINH TÚ TRẢM ✨", color: "#ffd700", stroke: "#664400" }
    ];
    const skillIndex = (this.question.id % 3);
    const currentSkill = isBoss ? skillPool[2] : skillPool[skillIndex];

    // Floating Hero Skill Banner
    const skillBanner = this.add.text(w / 2, 105, currentSkill.name, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '900',
      fontSize: '18px',
      color: currentSkill.color,
      stroke: currentSkill.stroke,
      strokeThickness: 5
    }).setOrigin(0.5).setDepth(30).setScale(0.3);

    this.tweens.add({
      targets: skillBanner,
      scale: 1.15,
      duration: 200,
      ease: 'Back.easeOut',
      onComplete: () => {
        this.time.delayedCall(700, () => {
          this.tweens.add({
            targets: skillBanner,
            alpha: 0,
            y: 80,
            duration: 250,
            onComplete: () => skillBanner.destroy()
          });
        });
      }
    });

    // Dash forward with afterimages
    for (let g = 0; g < 4; g++) {
      this.time.delayedCall(g * 35, () => {
        if (!this.playerSprite || !this.playerSprite.active) return;
        const ghost = this.add.sprite(this.playerSprite.x, this.playerSprite.y, this.playerSprite.texture.key, this.playerSprite.frame.name);
        ghost.setOrigin(0.5, 1);
        ghost.setScale(this.playerSprite.scaleX, this.playerSprite.scaleY);
        ghost.setAlpha(0.6 - g * 0.12);
        ghost.setTint(g % 2 === 0 ? 0x00e5ff : 0xffd700);
        ghost.setDepth(4);
        this.tweens.add({
          targets: ghost,
          alpha: 0,
          duration: 250,
          onComplete: () => ghost.destroy()
        });
      });
    }

    this.tweens.add({
      targets: this.playerSprite,
      x: monX - 90,
      duration: 180,
      ease: 'Cubic.easeOut',
      onComplete: () => {
        // Distinct Hero Skill VFX Execution
        if (skillIndex === 0 && !isBoss) {
          // --- SKILL 1: LÔI QUANG VECTƠ TRẢM ---
          audioSynth.playCritHit();
          this.cameras.main.shake(220, 0.02);

          // Vector Directional Arrow Beam
          const vecG = this.add.graphics().setDepth(8);
          vecG.lineStyle(4, 0x00e5ff, 1);
          vecG.beginPath();
          vecG.moveTo(this.playerSprite.x, this.playerSprite.y - 60);
          vecG.lineTo(monX, monMidY);
          vecG.strokePath();

          // Electric Lightning Arcs on monster
          for (let li = 0; li < 4; li++) {
            const lGfx = this.add.graphics().setDepth(9);
            lGfx.lineStyle(2.5, 0x7df9ff, 0.95);
            lGfx.beginPath();
            let curX = monX + Phaser.Math.Between(-30, 30);
            let curY = monMidY - 70;
            lGfx.moveTo(curX, curY);
            for (let s = 0; s < 5; s++) {
              curX += Phaser.Math.Between(-18, 18);
              curY += 28;
              lGfx.lineTo(curX, curY);
            }
            lGfx.strokePath();
            this.tweens.add({ targets: lGfx, alpha: 0, duration: 250, delay: li * 50, onComplete: () => lGfx.destroy() });
          }
          this.tweens.add({ targets: vecG, alpha: 0, duration: 300, onComplete: () => vecG.destroy() });

        } else if (skillIndex === 1 && !isBoss) {
          // --- SKILL 2: HỎA PHƯỢNG LIỆT ĐỊA TRẢM ---
          audioSynth.playSwordSlash();
          this.cameras.main.shake(240, 0.022);

          // Fiery Ground Wave from Kael to monster
          for (let f = 0; f < 8; f++) {
            const fX = this.playerSprite.x + (f / 8) * (monX - this.playerSprite.x);

              targets: flame,
              scaleY: 2.2,
              scaleX: 1.4,
              alpha: 0,
              duration: 320,
              delay: f * 25,
              onComplete: () => flame.destroy()
            });
          }

          // Magma geyser under monster
          for (let em = 0; em < 20; em++) {
            const ep = this.add.circle(monX + Phaser.Math.Between(-25, 25), this.monsterSprite.y - 10, Phaser.Math.Between(3, 6), 0xffaa00, 1).setDepth(11);
            this.tweens.add({
              targets: ep,
              y: monMidY - Phaser.Math.Between(40, 110),
              x: ep.x + Phaser.Math.Between(-40, 40),
              alpha: 0,
              duration: 400,
              onComplete: () => ep.destroy()
            });
          }

        } else {
          // --- SKILL 3: VÔ CỰC TINH TÚ TRẢM (SUPERNOVA FINISHER) ---
          audioSynth.playCritHit();
          this.cameras.main.shake(360, 0.03);
          this.cameras.main.flash(120, 255, 255, 255);

          // Golden Magic Circle
          const goldCircle = this.add.circle(monX, this.monsterSprite.y - 8, 70).setDepth(7);
          goldCircle.setStrokeStyle(3, 0xffd700, 0.9);
          this.tweens.add({ targets: goldCircle, scale: 1.4, alpha: 0, duration: 500, onComplete: () => goldCircle.destroy() });

          // 5 Celestial Swords raining down
          for (let sw = 0; sw < 5; sw++) {
            this.time.delayedCall(sw * 45, () => {
              const swGfx = this.add.graphics().setDepth(12);
              const dropX = monX + (sw - 2) * 22;
              swGfx.lineStyle(3, 0xffea00, 0.95);
              swGfx.beginPath();
              swGfx.moveTo(dropX, 50);
              swGfx.lineTo(dropX, monMidY + 20);
              swGfx.strokePath();
              this.tweens.add({ targets: swGfx, alpha: 0, duration: 240, onComplete: () => swGfx.destroy() });
            });
          }
        }

        // Finishing Impact & Rainbow Sparks
        this.time.delayedCall(200, () => {
          audioSynth.playCritHit();
          const ring = this.add.circle(monX, monMidY, 15);
          ring.setStrokeStyle(5, 0xffd700, 1);
          ring.setDepth(11);
          this.tweens.add({ targets: ring, radius: 140, alpha: 0, duration: 420, onComplete: () => ring.destroy() });

          for (let i = 0; i < 28; i++) {
            const angle = (i / 28) * Math.PI * 2;
            const dist = Phaser.Math.Between(60, 150);
            const spColor = Phaser.Math.RND.pick([0xffd700, 0x00e5ff, 0xff0055, 0x00ff88, 0xffffff, 0xffbe0b]);
            const sp = this.add.circle(monX, monMidY, Phaser.Math.Between(2.5, 5), spColor, 1).setDepth(13);
            this.tweens.add({
              targets: sp,
              x: monX + Math.cos(angle) * dist,
              y: monMidY + Math.sin(angle) * dist,
              alpha: 0,
              scale: 0.2,
              duration: Phaser.Math.Between(300, 500),
              onComplete: () => sp.destroy()
            });
          }

          const dmgText = isBoss ? '🔥 BÃO KÍCH VECTƠ HOÀN HẢO! -350 🔥' : '⚡ BẠO KÍCH TUYỆT ĐỈNH! -150 ⚡';
          this.showFloatingDamage(monX, monMidY - 75, dmgText, '#ffd700', true);

          this.monsterSprite.setTint(0xffffff);
          this.time.delayedCall(80, () => {
            if (!this.monsterSprite || !this.monsterSprite.active) return;
            this.monsterSprite.setTint(0xff2222);
            this.tweens.add({
              targets: this.monsterSprite,
              x: monX + 50,
              alpha: 0.2,
              duration: 260,
              yoyo: true,
              repeat: 1,
              onComplete: () => {
                this.monsterSprite.clearTint();
                this.handleVictory();
              }
            });
          });

          // Kael smooth return
          this.tweens.add({
            targets: this.playerSprite,
            x: startX,
            duration: 280,
            ease: 'Quad.easeInOut',
            onComplete: () => {
              if (this.anims.exists('anim_player_idle')) {
                this.playerSprite.play('anim_player_idle');
              }
            }
          });
        });
      }
    });
  }

          for (let m = 0; m < 20; m++) {
            const mist = this.add.circle(playerX + Phaser.Math.Between(-40, 40), playerMidY + Phaser.Math.Between(-40, 40), Phaser.Math.Between(6, 14), 0xa5f3fc, 0.45).setDepth(11);
            this.tweens.add({ targets: mist, scale: 1.8, alpha: 0, duration: 420, onComplete: () => mist.destroy() });
          }
        } else if (monId === 'ancient_golem' || monId === 'mushroom_crystal') {
          // Ancient Golem: Seismic Fissure & Golden Earth Shockwave
          const shock = this.add.ellipse(playerX, this.playerSprite.y - 2, 120, 25, 0xeab308, 0.9).setDepth(11);
          this.tweens.add({ targets: shock, scaleX: 1.6, scaleY: 1.6, alpha: 0, duration: 450, onComplete: () => shock.destroy() });
          for (let r = 0; r < 7; r++) {
            const rock = this.add.rectangle(playerX + (r - 3) * 18, this.playerSprite.y - 15, 16, 40, 0x475569).setDepth(12);
            rock.setStrokeStyle(2, 0xfacc15, 0.9);
            this.tweens.add({ targets: rock, y: rock.y - 35, alpha: 0, duration: 400, delay: r * 35, onComplete: () => rock.destroy() });
          }
        } else if (monId === 'shadow_phoenix' || monId === 'panther' || monId === 'storm_harpy') {
          // Shadow Phoenix / Storm Harpy: Dark Purple Void Vortex & Storm Whirlwind
          const vortex = this.add.circle(playerX, playerMidY, 40);
          vortex.setStrokeStyle(6, 0xa855f7, 0.95).setDepth(12);
          this.tweens.add({ targets: vortex, radius: 110, alpha: 0, duration: 480, onComplete: () => vortex.destroy() });
          for (let ft = 0; ft < 25; ft++) {
            const feat = this.add.ellipse(playerX, playerMidY, Phaser.Math.Between(4, 9), Phaser.Math.Between(12, 22), 0x581c87, 0.9).setDepth(12);
            feat.setRotation(Phaser.Math.FloatBetween(0, Math.PI * 2));
            this.tweens.add({
              targets: feat,
              x: playerX + Phaser.Math.Between(-80, 80),
              y: playerMidY + Phaser.Math.Between(-70, 70),
              rotation: feat.rotation + Math.PI,
              alpha: 0,
              duration: 480,
              onComplete: () => feat.destroy()
            });
          }
        } else if (monId === 'mushroom') {
          // Poison Spore Cloud
          for (let sc = 0; sc < 18; sc++) {
            const spore = this.add.circle(playerX + Phaser.Math.Between(-40, 40), playerMidY + Phaser.Math.Between(-40, 40), Phaser.Math.Between(5, 14), 0xa855f7, 0.45).setDepth(11);
            this.tweens.add({
              targets: spore,
              scale: 1.8,
              alpha: 0,
              duration: 450,
              onComplete: () => spore.destroy()
            });
          }
        } else if (monId === 'spider') {
          // Web Net Wrap
          const webGfx = this.add.graphics().setDepth(12);
          webGfx.lineStyle(2, 0xd8b4fe, 0.85);
          for (let w = 0; w < 6; w++) {
            webGfx.beginPath();
            webGfx.moveTo(playerX, playerMidY);
            const wAng = (w / 6) * Math.PI * 2;
            webGfx.lineTo(playerX + Math.cos(wAng) * 45, playerMidY + Math.sin(wAng) * 45);
            webGfx.strokePath();
          }
          this.tweens.add({ targets: webGfx, alpha: 0, duration: 420, onComplete: () => webGfx.destroy() });
        } else if (monId === 'bat' || monId === 'bat_vampire') {
          // Concentric Sonic Blood Screams
          for (let sr = 0; sr < 4; sr++) {
            this.time.delayedCall(sr * 70, () => {
              const ring = this.add.circle(playerX, playerMidY, 15);
              ring.setStrokeStyle(3, 0xff0044, 0.9).setDepth(11);
              this.tweens.add({ targets: ring, radius: 90, alpha: 0, duration: 320, onComplete: () => ring.destroy() });
            });
          }
        } else {
          // Malakar Void Oblivion Laser Beam
          const laser = this.add.rectangle(w / 2, playerMidY, w, 28, 0xa855f7, 0.95).setDepth(12);
          laser.setStrokeStyle(2, 0xffd700);
          this.tweens.add({ targets: laser, scaleY: 2.2, alpha: 0, duration: 420, onComplete: () => laser.destroy() });
        }

        // Blood Droplets
        for (let b = 0; b < 16; b++) {
          const blood = this.add.circle(playerX, playerMidY, Phaser.Math.Between(2, 4.5), 0xff1133, 0.9).setDepth(12);
          this.tweens.add({
            targets: blood,
            x: playerX - Phaser.Math.Between(15, 75),
            y: playerMidY + Phaser.Math.Between(-35, 45),
            alpha: 0,
            scale: 0.2,
            duration: 340,
            onComplete: () => blood.destroy()
          });
        }

        this.playerSprite.setTint(0xff1122);
        this.showFloatingDamage(playerX, playerMidY - 50, `-${this.monsterData.attack} HP!`, '#ff2244', true);

        GAME_DATA.player.hp = Math.max(0, GAME_DATA.player.hp - this.monsterData.attack);
        if (GAME_DATA.player.hp <= 30 && GAME_DATA.player.hearts > 1) {
          GAME_DATA.player.hearts--;
        }

        this.time.delayedCall(300, () => {
          if (this.playerSprite && this.playerSprite.active) {
            this.playerSprite.clearTint();
          }
        });

        if (GAME_DATA.player.hp <= 0) {
          this.time.delayedCall(600, () => this.handlePlayerDefeat());
        } else {
          this.time.delayedCall(600, () => {
            this.isAnswering = false;
            this.startTimer();
          });
        }
      }
    });
  }

  resetForRetry() {
    this.isAnswering = false;
    this.optionButtons.forEach((btn) => {
      btn.bg.fillColor = 0x1b233a;
      btn.bg.setStrokeStyle(2, 0x4a6fa5);
      btn.label.setText(btn.originalText);
      btn.label.setColor('#ffffff');
    });
    this.startTimer();
  }

  handleVictory() {
    GAME_DATA.player.gold += this.monsterData.gold;
    GAME_DATA.player.exp += this.monsterData.exp;

    audioSynth.playLevelUp();
    this.showFloatingDamage(this.playerSprite.x, this.playerSprite.y - 90, `+${this.monsterData.gold} vàng!`, '#ffd700', true);

    const mX = this.monsterSprite.x;
    const mY = this.monsterSprite.y - (this.monsterSprite.displayHeight / 2);

    // 1. Monster Disintegration into 36 Fiery Ash Motes
    for (let ash = 0; ash < 36; ash++) {
      const ashColor = Phaser.Math.RND.pick([0xff5500, 0x8a2be2, 0xffd700, 0x222222]);
      const mote = this.add.circle(mX + Phaser.Math.Between(-40, 40), mY + Phaser.Math.Between(-40, 40), Phaser.Math.Between(2, 4.5), ashColor, 0.95);
      mote.setDepth(15);
      this.tweens.add({
        targets: mote,
        y: mote.y - Phaser.Math.Between(80, 180),
        x: mote.x + Phaser.Math.Between(-60, 60),
        alpha: 0,
        scale: 0.1,
        duration: Phaser.Math.Between(600, 1200),
        ease: 'Quad.easeOut',
        onComplete: () => mote.destroy()
      });
    }

    // 2. Rising Golden Celestial Soul Orbs
    for (let so = 0; so < 12; so++) {
      const soul = this.add.circle(mX + Phaser.Math.Between(-30, 30), mY + Phaser.Math.Between(-20, 20), Phaser.Math.Between(3, 5), 0x00e5ff, 0.9);
      soul.setDepth(16);
      this.tweens.add({
        targets: soul,
        y: soul.y - Phaser.Math.Between(120, 220),
        x: soul.x + Phaser.Math.Between(-40, 40),
        alpha: 0,
        scale: 0.2,
        duration: Phaser.Math.Between(800, 1400),
        ease: 'Cubic.easeOut',
        onComplete: () => soul.destroy()
      });
    }

    // 3. Fountain of Gold Coins & XP Gems flying towards Kael
    for (let c = 0; c < 8; c++) {
      const coin = this.add.text(mX, mY, c % 2 === 0 ? '🪙' : '✨', { fontSize: '18px' }).setOrigin(0.5).setDepth(20);
      const sprayX = mX + Phaser.Math.Between(-60, 60);
      const sprayY = mY - Phaser.Math.Between(40, 100);
      this.tweens.add({
        targets: coin,
        x: sprayX,
        y: sprayY,
        duration: 250,
        ease: 'Quad.easeOut',
        onComplete: () => {
          this.tweens.add({
            targets: coin,
            x: this.playerSprite.x,
            y: this.playerSprite.y - 40,
            scale: 0.5,
            alpha: 0.2,
            duration: 380,
            ease: 'Cubic.easeIn',
            onComplete: () => {
              coin.destroy();
              audioSynth.playCoin();
            }
          });
        }
      });
    }

    this.tweens.add({
      targets: this.monsterSprite,
      alpha: 0,
      scaleY: this.monsterSprite.scaleY * 0.35,
      duration: 650,
      ease: 'Power2'
    });

    if (GAME_DATA.player.exp >= GAME_DATA.player.maxExp) {
      GAME_DATA.player.level++;
      GAME_DATA.player.exp = 0;
      GAME_DATA.player.maxExp += 50;
      GAME_DATA.player.attack += 12;
      GAME_DATA.player.defense += 8;
      GAME_DATA.player.hp = GAME_DATA.player.maxHp;
      this.showLevelUpNotification();
    }

    this.time.delayedCall(1600, () => {
      if (this.question.id === 15) {
        this.scene.stop('GameScene');
        this.scene.start('VictoryScene');
      } else {
        this.scene.stop();
        this.scene.resume('GameScene');
        const gameScene = this.scene.get('GameScene');
        if (gameScene) {
          gameScene.handleDefeatedMonster(this.monsterData.id);
        }
      }
    });
  }

  handlePlayerDefeat() {
    this.cameras.main.fade(600, 0, 0, 0);
    this.time.delayedCall(650, () => {
      this.scene.stop('GameScene');
      this.scene.start('GameOverScene');
    });
  }

  showFloatingDamage(x, y, text, color = '#ffffff', isBig = false) {
    const fontSize = isBig ? '22px' : '16px';
    const dmg = this.add.text(x, y, text, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '900',
      fontSize: fontSize,
      color: color,
      stroke: '#000000',
      strokeThickness: 5
    }).setOrigin(0.5).setDepth(25);

    dmg.setScale(isBig ? 1.6 : 1.2);
    this.tweens.add({
      targets: dmg,
      scale: 1,
      y: y - (isBig ? 65 : 45),
      alpha: 0,
      duration: isBig ? 1200 : 850,
      ease: 'Back.easeOut',
      onComplete: () => dmg.destroy()
    });
  }

  showLevelUpNotification() {
    const w = this.cameras.main.width;
    const banner = this.add.container(w / 2, 140);
    const bg = this.add.rectangle(0, 0, 420, 52, 0x111c38, 0.95);
    bg.setStrokeStyle(3, 0xffd700);

    const txt = this.add.text(0, 0, `🪽 Lên cấp! (Cấp ${GAME_DATA.player.level}) 🪽`, {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '15px',
      color: '#ffd700'
    }).setOrigin(0.5);

    banner.add([bg, txt]);
    this.tweens.add({
      targets: banner,
      scale: 1.1,
      duration: 250,
      yoyo: true,
      repeat: 3,
      onComplete: () => banner.destroy()
    });
  }
}

    const h = this.cameras.main.height;

    this.add.rectangle(w / 2, h / 2, w, h, 0x081220);

    for (let i = 0; i < 70; i++) {
      const px = Phaser.Math.Between(0, w);
      const py = Phaser.Math.Between(-50, h);
      const colors = [0xffd700, 0x00ff88, 0x00e5ff, 0xff007f, 0xffffff];
      const spark = this.add.circle(px, py, Phaser.Math.Between(2, 4), Phaser.Utils.Array.GetRandom(colors));
      this.tweens.add({
        targets: spark,
        y: h + 50,

        duration: Phaser.Math.Between(3000, 6000),
        repeat: -1,
        delay: Phaser.Math.Between(0, 2500)

    // Radiant Golden God Rays behind Victory Crown

        const ray = this.add.image(w / 2, 75, 'vfx_godray');

        ray.setAlpha(0.24);

          targets: ray,

    this.tweens.add({
      targets: crown,
      scale: 1.1,
      duration: 900,
      yoyo: true,

    this.add.text(w / 2, 175, 'Hạt Giống Tro Tàn đã nảy mầm vĩnh cửu', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '700',
      fontSize: '20px',
      color: '#ffd700',
      stroke: '#000',
      strokeThickness: 5
    }).setOrigin(0.5);

    this.add.text(w / 2, 215, 'Khổng Lồ Dung Nham & Binh Đoàn Hầm Ngục đã bị phong ấn bởi Đại Số Vectơ!', {
      fontFamily: FONT_PRIMARY,
      fontWeight: '600',
      fontSize: '14.5px',
      color: '#00e5ff'
    }).setOrigin(0.5);

    const card = this.add.rectangle(w / 2, 375, 680, 230, 0x141e38, 0.95);
    card.setStrokeStyle(3, 0xffd700);

    const statsText = [
      `⚔️ Hiệp sĩ: ${GAME_DATA.player.name} (Cấp ${GAME_DATA.player.level})`,
      `👾 Quái vật tiêu diệt: 15/15 (Bao gồm Đại Trùm Cuối)`,
      `📐 Chuyên đề Vectơ: Thành thạo 15/15 lý thuyết`,
      `🪙 Tổng vàng thu thập: ${GAME_DATA.player.gold} vàng`,
      `🌟 Danh hiệu đạt được: Đại sư Đại Số Vectơ`
    ];

    this.add.text(w / 2, 375, statsText.join('\n\n'), {
      fontFamily: FONT_PRIMARY,

      fontSize: '13px',

    }).setOrigin(0.5);

      fontWeight: '700',
      fontSize: '14px',
      color: '#ffffff'
    }).setOrigin(0.5);

    const restartGame = () => {

      GAME_DATA.player.mp = GAME_DATA.player.maxMp;
      GAME_DATA.player.hearts = 3;
      GAME_DATA.player.gold = 50;

      GAME_DATA.player.level = 1;

      window.currentChapter = 1;
      this.scene.start('MenuScene');

    btn.setInteractive({ useHandCursor: true });
    btn.on('pointerdown', restartGame);
    btnTxt.setInteractive({ useHandCursor: true });
    btnTxt.on('pointerdown', restartGame);
  }
}

    const canvas = container.querySelector('canvas');
    if (canvas && vctrl && canvas.nextSibling !== vctrl) {
      if (hud) container.appendChild(hud);
      if (vctrl) container.appendChild(vctrl);

  // 4 Theme & Style Modes matching the user's attached artwork:

  // 4. D-Pad Chữ thập Neon
  const CONTROL_STYLES = [
    { id: 'stone-buttons', label: '🕹️ Kiểu: Nút Đá', theme: 'theme-stone', isDpad: false },
    { id: 'stone-dpad', label: '🕹️ Kiểu: D-Pad Đá', theme: 'theme-stone', isDpad: true },
    { id: 'neon-buttons', label: '🕹️ Kiểu: Nút Neon', theme: 'theme-neon', isDpad: false },

  applyControlStyle(currentStyleIdx);

  // Multi-Touch Pointer Capture Binding
  function bindTouchBtn(btnId, onDown, onUp) {
    const btn = document.getElementById(btnId);
    if (!btn) return;

    let activePointers = new Set();

    const startAction = (e) => {
      if (e && e.cancelable) e.preventDefault();
      if (activePointers.size === 0) {
        btn.classList.add('active');
        if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
        onDown();
      }
      if (e && e.pointerId !== undefined) {
        activePointers.add(e.pointerId);
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
      }
    };

    const endAction = (e) => {
      if (e && e.cancelable) e.preventDefault();
      if (e && e.pointerId !== undefined) {
        activePointers.delete(e.pointerId);
      } else {
        activePointers.clear();
      }
      if (activePointers.size === 0) {
        btn.classList.remove('active');
        if (onUp) onUp();
      }
    };

    btn.addEventListener('pointerdown', startAction);
    btn.addEventListener('pointerup', endAction);
    btn.addEventListener('pointercancel', endAction);
    btn.addEventListener('lostpointercapture', endAction);

    btn.addEventListener('touchstart', startAction, { passive: false });
    btn.addEventListener('touchend', endAction, { passive: false });
    btn.addEventListener('touchcancel', endAction, { passive: false });
  }

  // Directional Thumb Sliding between Left and Right
  const bindDirectionSliding = () => {
    const dpadEl = document.getElementById('dpad-buttons');
    if (!dpadEl) return;
    const leftBtn = document.getElementById('vbtn-left');
    const rightBtn = document.getElementById('vbtn-right');

    dpadEl.addEventListener('pointermove', (e) => {
      if (e.buttons === 0 && e.pointerType === 'mouse') return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (el === leftBtn) {
        window.touchControls.left = true;
        window.touchControls.right = false;
        leftBtn.classList.add('active');
        if (rightBtn) rightBtn.classList.remove('active');
      } else if (el === rightBtn) {
        window.touchControls.right = true;
        window.touchControls.left = false;
        rightBtn.classList.add('active');
        if (leftBtn) leftBtn.classList.remove('active');
      }
    }, { passive: true });
  };
  bindDirectionSliding();

  // D-Pad Touch Drag Handling
  const initDpad = () => {
    const dpad = document.getElementById('vbtn-dpad');
    if (!dpad) return;

    let dpadPointerId = null;

    const handleDpadPos = (clientX, clientY) => {
      const rect = dpad.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.hypot(dx, dy);

      if (dist < 10) {
        window.touchControls.left = false;
        window.touchControls.right = false;
        return;
      }

      if (Math.abs(dx) > 12) {
        if (dx < 0) {
          window.touchControls.left = true;
          window.touchControls.right = false;
        } else {
          window.touchControls.right = true;
          window.touchControls.left = false;
        }
      } else {
        window.touchControls.left = false;
        window.touchControls.right = false;
      }

      if (dy < -22 && Math.abs(dy) > Math.abs(dx) * 0.45) {
        window.touchControls.jump = true;
      } else {
        window.touchControls.jump = false;
      }
    };

    const stopDpad = (e) => {
      if (e && e.cancelable) e.preventDefault();
      dpadPointerId = null;
      window.touchControls.left = false;
      window.touchControls.right = false;
      window.touchControls.jump = false;
      dpad.classList.remove('active');
    };

    dpad.addEventListener('pointerdown', (e) => {
      if (e.cancelable) e.preventDefault();
      dpadPointerId = e.pointerId;
      try { dpad.setPointerCapture(e.pointerId); } catch(err){}
      dpad.classList.add('active');
      if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
      handleDpadPos(e.clientX, e.clientY);
    });

    dpad.addEventListener('pointermove', (e) => {
      if (dpadPointerId === e.pointerId) {
        if (e.cancelable) e.preventDefault();
        handleDpadPos(e.clientX, e.clientY);
      }
    });

    dpad.addEventListener('pointerup', stopDpad);
    dpad.addEventListener('pointercancel', stopDpad);
    dpad.addEventListener('lostpointercapture', stopDpad);
  };
  initDpad();

  // Attach button action callbacks
  bindTouchBtn('vbtn-left',

    () => { window.touchControls.left = false; }

  );

  );

  // Global safety release
  const resetAllTouchInputs = () => {

    document.querySelectorAll('.vbtn, .vbtn-dpad').forEach(b => b.classList.remove('active'));

  window.addEventListener('blur', resetAllTouchInputs);
  document.addEventListener('visibilitychange', () => { if (document.hidden) resetAllTouchInputs(); });

  // Mobile Orientation Hint Logic
  const orientHint = document.getElementById('orientation-hint');
  const dismissOrientBtn = document.getElementById('dismiss-orient-btn');
  let orientDismissed = false;

  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);

  const checkOrientation = () => {
    if (orientDismissed) return;
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth <= 900;
    if (orientHint) {
      if (isPortrait && isTouchDevice) {
        orientHint.classList.add('active');
      } else {
        orientHint.classList.remove('active');
      }
    }
  };

  if (dismissOrientBtn) {
    dismissOrientBtn.addEventListener('click', () => {
      orientDismissed = true;
      if (orientHint) orientHint.classList.remove('active');
    });
  }

  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => {
    setTimeout(checkOrientation, 200);

  checkOrientation();

  // Mobile AudioContext auto-unlock on first touch
  window.addEventListener('touchstart', () => audioSynth.resume(), { once: true });

  const muteBtn = document.getElementById('mute-btn');
  const muteIcon = document.getElementById('mute-icon');
  const muteText = document.getElementById('mute-text');
  const toggleSound = () => {
    const isMuted = audioSynth.toggleMute();
    if (muteIcon) muteIcon.textContent = isMuted ? '🔇' : '🔊';
    if (muteText) muteText.textContent = isMuted ? 'Đã tắt tiếng [M]' : 'Âm thanh [M]';
  };
  if (muteBtn) {
    muteBtn.addEventListener('click', toggleSound);
  }

  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const fsIcon = document.getElementById('fs-icon');
  const fsText = document.getElementById('fs-text');
  const stretchBtn = document.getElementById('stretch-btn');

  let isCssFullscreen = false;
  // Ưu tiên tỉ lệ màn hình chuẩn điện thoại 16:9 (mặc định không méo hình)
  let isStretchMode = false;

  const updateFullscreenUI = (isFS) => {
    if (fsIcon) fsIcon.textContent = isFS ? '🗗' : '🖥️';
    if (fsText) fsText.textContent = isFS ? 'Thu nhỏ [F]' : 'Toàn màn hình [F]';
    if (fullscreenBtn) fullscreenBtn.setAttribute('title', isFS ? 'Thu nhỏ màn hình [Phím F hoặc ESC]' : 'Phóng to Toàn màn hình [Phím F hoặc F11]');
    if (window.ensureControlsInContainer) window.ensureControlsInContainer();
    if (window.showVirtualControls) window.showVirtualControls();
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { 
        if (window.game && window.game.scale) window.game.scale.refresh();
        if (window.showVirtualControls) window.showVirtualControls();
      }, 120);

  };

  const activateCssFullscreen = () => {
    isCssFullscreen = true;
    document.body.classList.add('is-fullscreen');
    const container = document.getElementById('game-container');
    if (container) {
      container.classList.add('pseudo-fullscreen');
      container.classList.add('is-fullscreen');
    }
    updateFullscreenUI(true);
    if (window.ensureControlsInContainer) window.ensureControlsInContainer();
    if (window.showVirtualControls) window.showVirtualControls();
  };

  const deactivateCssFullscreen = () => {
    isCssFullscreen = false;
    document.body.classList.remove('is-fullscreen');
    const container = document.getElementById('game-container');
    if (container) {
      container.classList.remove('pseudo-fullscreen');
      container.classList.remove('is-fullscreen');
    }
    updateFullscreenUI(false);
    if (window.ensureControlsInContainer) window.ensureControlsInContainer();
    if (window.showVirtualControls) window.showVirtualControls();
  };

  const toggleFullScreen = () => {
    // 1. Kiểm tra nếu đang ở Native Fullscreen thì thoát
    const nativeFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

    if (nativeFS) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
      deactivateCssFullscreen();
      return;
    }

    if (isCssFullscreen) {
      deactivateCssFullscreen();
      return;
    }

    // 2. Chạy Fullscreen trực tiếp trên game-container (bao trùm cả Canvas và phím ảo)
    const container = document.getElementById('game-container') || document.documentElement;
    const reqFn = container.requestFullscreen || container.webkitRequestFullscreen || container.mozRequestFullScreen || container.msRequestFullscreen;

    if (reqFn) {
      try {
        const promise = reqFn.call(container);
        if (promise && typeof promise.then === 'function') {
          promise.then(() => {
            isCssFullscreen = false;
            document.body.classList.add('is-fullscreen');
            if (container) container.classList.add('is-fullscreen');
            updateFullscreenUI(true);
            if (window.ensureControlsInContainer) window.ensureControlsInContainer();
            if (window.showVirtualControls) window.showVirtualControls();
          }).catch((err) => {
            console.warn('Native requestFullscreen blocked, activating CSS Fullscreen fallback:', err);
            activateCssFullscreen();
          });
          return;
        } else {
          isCssFullscreen = false;
          document.body.classList.add('is-fullscreen');
          if (container) container.classList.add('is-fullscreen');
          updateFullscreenUI(true);
          if (window.ensureControlsInContainer) window.ensureControlsInContainer();
          if (window.showVirtualControls) window.showVirtualControls();
          return;
        }
      } catch (e) {
        console.warn('requestFullscreen exception, using fallback:', e);
        activateCssFullscreen();
        return;
      }
    }

    // 3. Dự phòng CSS Fullscreen trên iOS Safari và trình duyệt không hỗ trợ Native Fullscreen
    activateCssFullscreen();
  };

  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullScreen);
  }

  // Chuyển đổi Tỉ lệ chuẩn 16:9 (Ưu tiên điện thoại) / Ép tràn viền 100%
  const toggleStretchMode = () => {
    isStretchMode = !isStretchMode;
    const container = document.getElementById('game-container');
    if (container) {
      if (isStretchMode) {
        container.classList.add('forced-stretch');
      } else {
        container.classList.remove('forced-stretch');
      }
    }
    if (stretchBtn) {
      stretchBtn.innerHTML = isStretchMode 
        ? '<span class="btn-icon">📐</span> <span class="btn-text">Tỉ lệ chuẩn [Z]</span>'
        : '<span class="btn-icon">📐</span> <span class="btn-text">Tràn viền [Z]</span>';
    }
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { if (window.game && window.game.scale) window.game.scale.refresh(); }, 80);
      setTimeout(() => { if (window.game && window.game.scale) window.game.scale.refresh(); }, 200);
    }
  };

  if (stretchBtn) {
    stretchBtn.addEventListener('click', toggleStretchMode);
  }

  const handleFullscreenChange = () => {
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
    isCssFullscreen = isFS;
    const container = document.getElementById('game-container');
    if (isFS) {
      document.body.classList.add('is-fullscreen');
      if (container) container.classList.add('is-fullscreen');
    } else {
      document.body.classList.remove('is-fullscreen');
      if (container) {
        container.classList.remove('is-fullscreen');
        container.classList.remove('pseudo-fullscreen');
      }
    }
    updateFullscreenUI(isFS);
    if (window.ensureControlsInContainer) window.ensureControlsInContainer();
    if (window.showVirtualControls) window.showVirtualControls();
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { 
        if (window.game && window.game.scale) window.game.scale.refresh(); 
        if (window.showVirtualControls) window.showVirtualControls();
      }, 100);
      setTimeout(() => { 
        if (window.game && window.game.scale) window.game.scale.refresh(); 
        if (window.showVirtualControls) window.showVirtualControls();
      }, 350);
    }
  };

  document.addEventListener('fullscreenchange', handleFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
  document.addEventListener('mozfullscreenchange', handleFullscreenChange);
  document.addEventListener('MSFullscreenChange', handleFullscreenChange);

  window.addEventListener('resize', () => {
    if (window.ensureControlsInContainer) window.ensureControlsInContainer();
    if (window.showVirtualControls) window.showVirtualControls();
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { 
        if (window.game && window.game.scale) window.game.scale.refresh(); 
        if (window.showVirtualControls) window.showVirtualControls();
      }, 100);
    }
  });

  window.addEventListener('orientationchange', () => {
    if (window.ensureControlsInContainer) window.ensureControlsInContainer();
    if (window.showVirtualControls) window.showVirtualControls();
    if (window.game && window.game.scale) {
      window.game.scale.refresh();
      setTimeout(() => { 
        if (window.game && window.game.scale) window.game.scale.refresh(); 
        if (window.showVirtualControls) window.showVirtualControls();
      }, 150);
    }
  });

  // Global PC Hotkeys: [F] Fullscreen, [Z] Stretch Fill, [M] Mute sound, [Escape] Exit Fullscreen
  window.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

    if (e.key === 'f' || e.key === 'F') {
      toggleFullScreen();
    } else if (e.key === 'z' || e.key === 'Z') {
      toggleStretchMode();
    } else if (e.key === 'm' || e.key === 'M') {
      toggleSound();
    } else if (e.key === 'Escape' && isCssFullscreen) {
      toggleFullScreen();
    }
  });
};

let appHasStarted = false;
const triggerStartApp = () => {
  if (appHasStarted) return;
  appHasStarted = true;
  startApp();
};

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(triggerStartApp).catch(triggerStartApp);
  setTimeout(triggerStartApp, 600);
} else if (document.readyState === 'complete' || document.readyState === 'interactive') {
  triggerStartApp();
} else {
  window.addEventListener('DOMContentLoaded', triggerStartApp);
  window.addEventListener('load', triggerStartApp);
